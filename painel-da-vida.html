<title>Painel da Vida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Painel pessoal com tarefas do dia, demandas do trabalho e cinco pilares da vida: financeiro, estudos, emocional, saúde e trabalho.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================
   Painel da Vida — estilo monocromático (cartões brancos,
   destaque preto, pílulas e barras escuras arredondadas)
   ========================================================== */

:root {
  /* Layout: barra lateral fixa + cartões em grade; azul elétrico como única cor de destaque */
  --bg: #e7e9ef; --app: #eff1f5; --card: #ffffff;
  --ink: #10131a; --ink-2: #525866; --ink-3: #8a909d;
  --line: #e3e6ed; --soft: #f2f4f8; --hover: #e6e9f0; --track: #e2e6ee;
  --gray: #868c99; --on-hl: #ffffff;
  --dark: #111522; --on-dark: #ffffff;
  --accent: #1f6bff; --accent-2: #4d8dff; --on-accent: #ffffff; --accent-soft: #e6eeff; --accent-ink: #1754cc; --accent-glow: rgba(31, 107, 255, .35);
  --feat-a: #0c1326; --feat-b: #1c2c57; --feat-fg: #ffffff; --feat-muted: #b9c3dc;
  --bar-a: #2a3a66; --bar-b: #121a33; --hl-a: #4d8dff; --hl-b: #1f6bff;
  --goal: #b3b9c6; --up: #1f9d5c; --down: #dc4b4b; --feat-up: #5fd99a; --feat-down: #ff8a85;
  --danger-bg: #fdeaea; --danger-fg: #b8312e; --row-hover: #f7f8fb; --placeholder: #a0a6b3;
  --pill-bg: var(--card); --pill-line: transparent; --pill-card: var(--soft);
  --card-line: transparent; --side-bg: var(--card);
  --shadow: 0 1px 2px rgba(16, 19, 26, .04);
  --radius: 20px; --radius-sm: 12px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #04060b; --app: #070a11; --card: #0d1017;
  --ink: #eef1f7; --ink-2: #a8afbf; --ink-3: #727a8c;
  --line: #1c2230; --soft: #151a24; --hover: #1b2130; --track: #1c2230;
  --gray: #6f778a; --on-hl: #ffffff;
  --dark: #eef1f7; --on-dark: #0b0e15;
  --accent: #2f7bff; --accent-2: #5b95ff; --on-accent: #ffffff; --accent-soft: rgba(47, 123, 255, .14); --accent-ink: #7eadff; --accent-glow: rgba(47, 123, 255, .55);
  --feat-a: #10131b; --feat-b: #272c38; --feat-fg: #ffffff; --feat-muted: #b3b9c7;
  --bar-a: #22325a; --bar-b: #121b33; --hl-a: #5b95ff; --hl-b: #2f7bff;
  --goal: #39415a; --up: #3fcf86; --down: #ff6b66; --feat-up: #5fe0a0; --feat-down: #ff8f8a;
  --danger-bg: #2e1517; --danger-fg: #ff8f8a; --row-hover: #121620; --placeholder: #5d6577;
  --pill-bg: transparent; --pill-line: #2a3142; --pill-card: transparent;
  --card-line: #1a2030; --side-bg: #0a0d14;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #04060b; --app: #070a11; --card: #0d1017;
  --ink: #eef1f7; --ink-2: #a8afbf; --ink-3: #727a8c;
  --line: #1c2230; --soft: #151a24; --hover: #1b2130; --track: #1c2230;
  --gray: #6f778a; --on-hl: #ffffff;
  --dark: #eef1f7; --on-dark: #0b0e15;
  --accent: #2f7bff; --accent-2: #5b95ff; --on-accent: #ffffff; --accent-soft: rgba(47, 123, 255, .14); --accent-ink: #7eadff; --accent-glow: rgba(47, 123, 255, .55);
  --feat-a: #10131b; --feat-b: #272c38; --feat-fg: #ffffff; --feat-muted: #b3b9c7;
  --bar-a: #22325a; --bar-b: #121b33; --hl-a: #5b95ff; --hl-b: #2f7bff;
  --goal: #39415a; --up: #3fcf86; --down: #ff6b66; --feat-up: #5fe0a0; --feat-down: #ff8f8a;
  --danger-bg: #2e1517; --danger-fg: #ff8f8a; --row-hover: #121620; --placeholder: #5d6577;
  --pill-bg: transparent; --pill-line: #2a3142; --pill-card: transparent;
  --card-line: #1a2030; --side-bg: #0a0d14;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}
button { font: inherit; color: inherit; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  background: var(--app);
  max-width: 1480px;
  margin: 0 auto;
}

.sidebar {
  background: var(--side-bg); box-shadow: inset -1px 0 0 var(--card-line);
  padding: 28px 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar a:focus-visible, button:focus-visible, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.brand { font-weight: 800; font-size: 22px; letter-spacing: -.04em; padding: 0 12px 24px; white-space: nowrap; }
.brand span { color: var(--accent); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14.5px;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--soft); color: var(--ink); }
.nav a.active { background: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: 0 6px 18px var(--accent-glow); }
.nav .l-short { display: none; }

.side-card {
  margin-top: auto;
  background: linear-gradient(140deg, var(--feat-a), var(--feat-b) 55%, var(--feat-a));
  color: var(--feat-fg); border-radius: 18px; padding: 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.side-card p { margin: 0; font-size: 12.5px; color: var(--feat-muted); }
.side-card strong { font-size: 30px; letter-spacing: -.03em; line-height: 1.1; }
.side-card span { font-size: 12.5px; color: var(--feat-muted); margin-bottom: 10px; }
.nav-bottom { margin-top: 12px; }

.main { padding-block: 28px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* ---------- Header ---------- */
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.03em; margin: 4px 0 6px; line-height: 1.15; }
.desc { color: var(--ink-2); font-size: 14px; max-width: 620px; margin: 0; line-height: 1.5; }
.head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.banner {
  background: var(--dark); color: var(--on-dark); border-radius: 16px;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; margin-bottom: 20px; font-size: 13.5px; flex-wrap: wrap;
}
.banner .btn { background: var(--card); color: var(--ink); }

/* ---------- Pills / buttons ---------- */
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  border: 0; background: var(--pill-bg); box-shadow: inset 0 0 0 1px var(--pill-line); border-radius: 999px;
  padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: background .15s, color .15s; white-space: nowrap;
}
.pill:hover { background: var(--hover); }
.pill.active { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.pills.on-card .pill { background: var(--pill-card); }
.pills.on-card .pill.active { background: var(--accent); }

.date-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 999px; padding: 8px 14px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.nav-group { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 4px; }
.nav-group .label { padding: 0 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft);
  display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none;
  transition: background .15s;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn .ic { width: 16px; height: 16px; }
.icon-btn.plain { background: transparent; }
.icon-btn.plain:hover { background: var(--soft); }

.btn {
  border: 0; border-radius: var(--radius-sm); padding: 10px 16px;
  font-weight: 600; font-size: 13.5px; background: var(--accent); color: var(--on-accent);
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  transition: opacity .15s, background .15s;
}
.btn:hover { opacity: .88; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.ghost:hover { background: var(--hover); opacity: 1; }
.btn.light { background: rgba(255,255,255,.14); color: var(--feat-fg); justify-content: center; text-decoration: none; }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
.btn.danger { background: var(--danger-bg); color: var(--danger-fg); }

/* ---------- Stat cards ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.stat {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px;
  min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  box-shadow: var(--shadow), inset 0 0 0 1px var(--card-line);
}
.stat.dark {
  background:
    linear-gradient(120deg, rgba(255,255,255,.06) 0 30%, transparent 30% 60%, rgba(255,255,255,.04) 60%),
    linear-gradient(140deg, var(--feat-a), var(--feat-b) 55%, var(--feat-a));
  color: var(--feat-fg);
}
.stat .label { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.stat.dark .label { color: var(--feat-muted); }
.stat .value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.stat .value small { font-size: 13.5px; font-weight: 500; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.stat.dark .value small { color: var(--feat-muted); }
.trend { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stat.dark .trend { color: var(--feat-muted); }
.trend .up, .trend .down { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
.trend .up { color: var(--up); }
.trend .down { color: var(--down); }
.stat.dark .trend .up { color: var(--feat-up); }
.stat.dark .trend .down { color: var(--feat-down); }
.trend .ic { width: 14px; height: 14px; }

/* ---------- Grid / cards ---------- */
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow), inset 0 0 0 1px var(--card-line); }
.card.flush { padding-left: 0; padding-right: 0; }
.card.flush .card-head { padding: 0 22px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.card-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.card-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.card-foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.mono { font-variant-numeric: tabular-nums; }
.tip { font-size: 12.5px; color: var(--ink-2); background: var(--soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 14px; line-height: 1.5; }
.empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 18px 0; }

/* ---------- Bar chart ---------- */
.chart { display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; row-gap: 10px; }
.chart-y { position: relative; height: var(--h); font-size: 11.5px; color: var(--ink-3); }
.chart-y span { position: absolute; right: 0; transform: translateY(50%); line-height: 1; }
.chart-plot {
  position: relative; height: var(--h);
  display: flex; align-items: flex-end; gap: clamp(6px, 3%, 26px);
}
.bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; min-width: 0; }
.bar-col.clickable { cursor: pointer; }
.bar {
  width: 100%; max-width: 58px; border-radius: 14px; position: relative;
  background:
    linear-gradient(125deg, rgba(255,255,255,.10) 0 22%, transparent 22% 48%, rgba(255,255,255,.06) 48% 62%, transparent 62%),
    linear-gradient(180deg, var(--bar-a), var(--bar-b));
  transition: height .35s ease;
}
.bar.hl { background: linear-gradient(180deg, var(--hl-a), var(--hl-b)); box-shadow: 0 0 22px var(--accent-glow); }
.bar.zero { background: var(--soft); }
.bar-col.selected .bar { outline: 2px solid var(--ink); outline-offset: 3px; }
.bar-col:hover .bar::after {
  content: attr(data-v); position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--card); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 7px; white-space: nowrap; z-index: 2;
}
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--goal); pointer-events: none; z-index: 1; }
.goal-line span { position: absolute; right: 0; top: -18px; font-size: 10.5px; color: var(--ink-3); background: var(--card); padding: 0 4px; border-radius: 4px; }
.chart-x { grid-column: 2; display: flex; gap: clamp(6px, 3%, 26px); }
.chart-x span { flex: 1; text-align: center; font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-x span.hl { color: var(--ink); font-weight: 700; }

/* ---------- Week strip ---------- */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day {
  border: 0; background: var(--soft); border-radius: 14px; padding: 11px 0 9px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 700; color: var(--ink-3); cursor: pointer;
  transition: background .15s, color .15s, transform .1s;
}
.day:active { transform: scale(.96); }
.day .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.day.done { background: var(--accent); color: var(--on-accent); }
.day.done .dot { background: var(--on-accent); border-color: var(--on-accent); }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day:disabled { opacity: .4; cursor: default; }

.mini-days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; }
.mini-days button { aspect-ratio: 1; border: 0; border-radius: 6px; background: var(--soft); cursor: pointer; padding: 0; }
.mini-days button.on { background: var(--accent); }
.mini-days button.today { box-shadow: inset 0 0 0 2px var(--accent); }

/* ---------- Calendar (overview) ---------- */
.cal-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; font-weight: 600; font-size: 15px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-col {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 10px 0 12px; border-radius: 14px; font-size: 12.5px; color: var(--ink-3);
}
.cal-col b { font-size: 14px; color: var(--ink); font-weight: 600; }
.cal-col.active { background: linear-gradient(180deg, var(--hl-a), var(--hl-b)); color: var(--on-hl); box-shadow: 0 6px 20px var(--accent-glow); }
.cal-col.active b { color: var(--on-hl); }
.cal-col.future { opacity: .45; }
.marks { display: flex; gap: 3px; }
.marks em { width: 5px; height: 5px; border-radius: 50%; background: var(--track); }
.marks em.on { background: var(--accent); }
.cal-col.active .marks em { background: rgba(255,255,255,.35); }
.cal-col.active .marks em.on { background: var(--on-hl); }
.legend { font-size: 11.5px; color: var(--ink-3); text-align: center; margin-top: 12px; }

/* ---------- Donut ---------- */
.donut-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.donut {
  --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0);
  display: grid; place-items: center;
}
.donut::before { content: ''; grid-area: 1/1; width: 48px; height: 48px; border-radius: 50%; background: var(--card); }
.donut span { grid-area: 1/1; font-size: 13px; font-weight: 700; z-index: 1; }

/* ---------- Progress ---------- */
.progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .35s ease; }
.progress.gray > span { background: var(--gray); }
.progress.thick { height: 12px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.kv b { color: var(--ink); font-weight: 600; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
.table th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 10px 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 13px 22px; border-bottom: 1px solid var(--line); }
.table tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--row-hover); }
.pillar-cell { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.pillar-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; }
.badge { display: inline-block; padding: 5px 14px; border-radius: 99px; background: var(--gray); color: var(--on-hl); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.dark { background: var(--accent); color: var(--on-accent); }
.badge.light { background: var(--soft); color: var(--ink-2); }

/* ---------- Rows / lists ---------- */
.row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:first-child { padding-top: 0; }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 14px; }
.row-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.row-meta { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-variant-numeric: tabular-nums; }
.row .pct { font-size: 12.5px; color: var(--ink-3); font-weight: 600; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

.toggle-btn {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px;
  padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.toggle-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.cat-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 110px; align-items: center; gap: 14px; padding: 8px 0; }
.cat-bar { height: 14px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.cat-bar span { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }

/* ---------- Inputs ---------- */
.input {
  border: 1px solid transparent; background: var(--soft); border-radius: var(--radius-sm);
  padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); width: 100%;
  transition: background .15s, border-color .15s;
}
.input::placeholder { color: var(--placeholder); }
.input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 92px; line-height: 1.5; }
.input.sm { padding: 7px 10px; font-size: 13px; }

<script>
'use strict';
/* ==========================================================
   Painel da Vida — 4 pilares: Financeiro, Estudos, Emocional, Saúde.
   Dados: banco do Artifact no Claude (privado para quem está logado),
   com cópia no navegador quando o banco não está disponível.
   ========================================================== */

/* ---------------- Datas ---------------- */
const D = {
  key(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; },
  todayKey() { return D.key(D.today()); },
  add(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; },
  monday(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); return r; },
  monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
  addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); return D.monthKey(new Date(y, m - 1 + n, 1)); },
  daysBetween(a, b) { return Math.round((b - a) / 864e5); },
};
const WEEKDAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WEEKDAYS_FULL = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MONTHS_SHORT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

const PILLARS = [
  { id: 'financeiro', n: '01', name: 'Financeiro', icon: 'wallet', title: 'Fatura, gastos e metas de longo prazo' },
  { id: 'estudos',    n: '02', name: 'Estudos',    icon: 'book',   title: 'Leitura e aprendizados' },
  { id: 'emocional',  n: '03', name: 'Emocional',  icon: 'smile',  title: 'Check-in e balanço da semana' },
  { id: 'saude',      n: '04', name: 'Saúde',      icon: 'heart',  title: 'Treino, sono e movimento' },
  { id: 'trabalho',   n: '05', name: 'Trabalho',   icon: 'briefcase', title: 'Expediente e evolução no trabalho' },
];
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- Estado ---------------- */
function defaultState() {
  return {
    sample: false,
    settings: { name: '', trainGoal: 5, sleepGoal: 8, pagesGoal: 15, focusGoal: 60, habitName: 'Caminhada de 20 min',
      work: { company: 'Gerar', role: 'Auxiliar administrativo', start: '13:30', end: '17:30', days: [0, 1, 2, 3, 4], gmailOn: false, gmailDomain: 'gerar.org.br', gmailSince: 0, gmailV: 0 } },
    days: {},   // 'AAAA-MM-DD' -> { trained, sleep, energy, pages, habit }
    weeks: {},  // segunda 'AAAA-MM-DD' -> { feeling, good, insights, q1, q2, q3, ratings }
    records: [],
    books: [],
    wishlist: [],  // livros que quero ler: { id, title, author, total }
    notes: [],     // anotações e frases: { id, book, kind: 'nota'|'frase', text, page, at }
    demands: [],   // demandas do trabalho: { id, src: 'gmail'|'manual', thread, from, subject, date, status, seen, attach }
    workGoals: [], // objetivos profissionais: { id, name, progress, updatedAt }
    tasks: [],  // rotina fixa: { id, name, pillar, days: [0-6, seg=0], from: 'AAAA-MM-DD' }
    finance: { categories: ['Moradia', 'Alimentação', 'Transporte', 'Lazer', 'Assinaturas e cursos'], months: {}, goals: [], budgets: {}, fixed: [], installments: [] },
  };
}

function rng(seed) { let s = seed % 2147483647; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function sampleState() {
  const s = defaultState();
  s.sample = true;
  const r = rng(20261123), today = D.today();
  for (let i = 69; i >= 1; i--) {
    s.days[D.key(D.add(today, -i))] = {
      trained: r() < 0.66,
      sleep: Math.round((6 + r() * 2.6) * 2) / 2,
      energy: 2 + Math.floor(r() * 4),
      pages: i <= 3 ? 15 + Math.floor(r() * 10) : (r() < 0.8 ? 6 + Math.floor(r() * 20) : 0),
      habit: i < 23 || r() < 0.6,
    };
  }
  s.days[D.key(today)] = { trained: true, sleep: 7, energy: 3, pages: 12, habit: false };
  const from = D.key(D.add(today, -30));

function normalize(raw) {
  const s = Object.assign(defaultState(), raw || {});
  s.settings = Object.assign(defaultState().settings, (raw && raw.settings) || {});
  s.finance = Object.assign(defaultState().finance, s.finance || {});
  ['days', 'weeks'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  s.settings.work = Object.assign(defaultState().settings.work, (raw && raw.settings && raw.settings.work) || {});
  ['records', 'books', 'tasks', 'workGoals', 'demands', 'wishlist', 'notes'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.finance.months || typeof s.finance.months !== 'object') s.finance.months = {};
  if (!Array.isArray(s.finance.goals)) s.finance.goals = [];
  if (!Array.isArray(s.finance.categories)) s.finance.categories = [];
  if (!s.finance.budgets || typeof s.finance.budgets !== 'object' || Array.isArray(s.finance.budgets)) s.finance.budgets = {};
  ['fixed', 'installments'].forEach(k => { if (!Array.isArray(s.finance[k])) s.finance[k] = []; });
  return s;
}

/* Estado <-> documentos do banco (um por mês de dias, um por mês de finanças, um por ano de semanas) */
const clone = o => JSON.parse(JSON.stringify(o));
function toDocs(s) {
  const docs = {
    config: { v: 2, sample: !!s.sample, settings: s.settings, records: s.records, books: s.books, tasks: s.tasks, workGoals: s.workGoals, wishlist: s.wishlist, budgets: s.finance.budgets, fixed: s.finance.fixed, installments: s.finance.installments, categories: s.finance.categories, goals: s.finance.goals },
  };
  Object.entries(s.days).forEach(([k, v]) => { const id = 'd-' + k.slice(0, 7); (docs[id] = docs[id] || { days: {} }).days[k] = v; });
  Object.entries(s.weeks).forEach(([k, v]) => { const id = 'w-' + k.slice(0, 4); (docs[id] = docs[id] || { weeks: {} }).weeks[k] = v; });
  Object.entries(s.finance.months).forEach(([k, v]) => { docs['f-' + k] = v; });
  if (s.demands.length) docs.demands = { items: s.demands.slice(-300) };
  const nb = {}; s.notes.forEach(n => { (nb[n.book] = nb[n.book] || []).push(n); });
  Object.entries(nb).forEach(([b, items]) => { docs['n-' + b] = { items }; });
  return docs;
}
function fromDocs(docs) {
  const c = docs.config || {};
  const s = normalize({ demands: (docs.demands || {}).items, sample: c.sample, settings: c.settings, records: c.records, books: c.books, tasks: c.tasks, workGoals: c.workGoals, wishlist: c.wishlist, finance: { categories: c.categories, goals: c.goals, months: {}, budgets: c.budgets, fixed: c.fixed, installments: c.installments } });
  Object.entries(docs).forEach(([id, d]) => {
    if (id.startsWith('d-')) Object.assign(s.days, d.days || {});
    else if (id.startsWith('w-')) Object.assign(s.weeks, d.weeks || {});
    else if (id.startsWith('f-')) s.finance.months[id.slice(2)] = d;
    else if (id.startsWith('n-')) (d.items || []).forEach(n => s.notes.push(n));
  });
  return clone(s);
}
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

const LOCAL_KEY = 'painel-vida:v2';
const Store = {
  state: null,
  mode: 'loading',     // loading | cloud | local
  loadNote: '',
  day(k) { return this.state.days[k] || (this.state.days[k] = {}); },
  week(k) { return this.state.weeks[k] || (this.state.weeks[k] = { ratings: {} }); },
  month(mk) { return this.state.finance.months[mk] || (this.state.finance.months[mk] = { income: 0, categories: {} }); },
};

const Sync = {
  col: null, written: {}, busy: {}, dirty: new Set(), textTimer: null,
  saving() { return Object.values(this.busy).some(Boolean) || this.dirty.size > 0 || !!this.textTimer; },
  push() {
    if (Store.mode === 'local') { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Store.state)); } catch (e) { /* sem armazenamento */ } return; }
    if (!this.col) return;
    const docs = toDocs(Store.state);
    const ids = new Set([...Object.keys(docs), ...Object.keys(this.written)]);
    ids.forEach(id => {
      const cur = docs[id] ? stable(docs[id]) : undefined;
      if (cur !== this.written[id]) this.write(id, docs[id] ? clone(docs[id]) : null, cur);
    });
    updateSync();
  },
  async write(id, body, json) {
    if (this.busy[id]) { this.dirty.add(id); return; }
    this.busy[id] = true;
    try {
      if (body) await this.col.doc(id).set(body); else await this.col.doc(id).delete();
      if (json === undefined) delete this.written[id]; else this.written[id] = json;
    } catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'O espaço do banco acabou. Apague meses antigos para continuar salvando.' : 'Não foi possível salvar agora. Vou tentar de novo na próxima alteração.');
    } finally {
      this.busy[id] = false;
      if (this.dirty.delete(id)) this.push();
      updateSync();
    }
  },
  pushTextSoon() {
    clearTimeout(this.textTimer);
    this.textTimer = setTimeout(() => { this.textTimer = null; this.push(); }, 700);
    updateSync();
  },
};

async function boot() {
  let db = null, id = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const [dbNs, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = dbNs;
      id = user ? await user.id() : null;
    }
  } catch (e) { db = null; }

  if (!db || !id) {
    Store.mode = 'local';
    let raw = null;
    try { raw = localStorage.getItem(LOCAL_KEY); } catch (e) { raw = null; }
    try { Store.state = raw ? normalize(JSON.parse(raw)) : defaultState(); } catch (e) { Store.state = defaultState(); }
    Store.fresh = !raw;
    render();
    Gmail.init(); Focus.init();
    return;
  }

  Sync.col = db.collection('data/users/' + id);
  const timer = setTimeout(() => { if (Store.mode === 'loading') { Store.loadNote = 'O banco do Claude ainda não respondeu. Confira a conexão; o painel abre assim que os dados chegarem.'; render(); } }, 10000);
  Sync.col.onSnapshot(snap => {
    const docs = {}, json = {};
    snap.docs.forEach(d => { if (d.exists) { docs[d.id] = d.data(); json[d.id] = stable(docs[d.id]); } });
    if (Store.mode === 'loading') {
      if (snap.metadata.fromCache && snap.empty) return; // espera a resposta do banco
      clearTimeout(timer);
      Store.mode = 'cloud';
      Sync.written = json;
      Store.fresh = snap.empty;
      Store.state = snap.empty ? defaultState() : fromDocs(docs);
      render();
      Gmail.init(); Focus.init();
      return;
    }
    if (Sync.saving()) return;
    const same = Object.keys(json).length === Object.keys(Sync.written).length && Object.keys(json).every(k => json[k] === Sync.written[k]);
    if (same) return;
    Sync.written = json;
    Store.state = fromDocs(docs);
    Store.fresh = false;
    safeRender();
  }, err => {
    clearTimeout(timer);
    if (Store.mode === 'loading') {
      Store.mode = 'local';
      Store.state = defaultState();
      Store.fresh = true;
      toast('Não consegui abrir o banco do Claude. Usando o armazenamento deste navegador.');
      render();
    } else {
      toast('A sincronização parou. Recarregue a página para retomar.');
    }
  });
}

/* ---------------- Cálculos ---------------- */
const Calc = {
  dayVal(k) { return Store.state.days[k] || {}; },
  range(start, n) { return Array.from({ length: Math.max(0, n) }, (_, i) => D.add(start, i)); },
  weekDays(mon) { return Calc.range(mon, 7); },
  upToToday(dates) { const t = D.today(); return dates.filter(d => d <= t); },
  trainsIn(dates) { return dates.filter(d => Calc.dayVal(D.key(d)).trained).length; },
  trains(mon) { return Calc.trainsIn(Calc.weekDays(mon)); },
  avgOf(dates, f) { const v = dates.map(d => Calc.dayVal(D.key(d))[f]).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; },
  sleepAvg(dates) { return Calc.avgOf(dates, 'sleep'); },
  energyAvg(dates) { return Calc.avgOf(dates, 'energy'); },
  pages(dates) { return dates.reduce((a, d) => a + (Calc.dayVal(D.key(d)).pages || 0), 0); },
  streak(pred) {
    let d = D.today();
    if (!pred(Calc.dayVal(D.key(d)))) d = D.add(d, -1);
    let n = 0;
    while (pred(Calc.dayVal(D.key(d))) && n < 3650) { n++; d = D.add(d, -1); }
    return n;
  },
  readStreak() { const g = Store.state.settings.pagesGoal; return Calc.streak(v => g > 0 && (v.pages || 0) >= g); },
  habitStreak() { return Calc.streak(v => !!v.habit); },
  trainRecord() {
    const c = {};
    Object.entries(Store.state.days).forEach(([k, v]) => { if (v.trained) { const m = D.key(D.monday(D.parse(k))); c[m] = (c[m] || 0) + 1; } });
    return Math.max(0, ...Object.values(c));
  },
  monthDates(mk) { const [y, m] = mk.split('-').map(Number); return Calc.range(new Date(y, m - 1, 1), new Date(y, m, 0).getDate()); },
  income(mk) { return +((Store.state.finance.months[mk] || {}).income) || 0; },
  expenses(mk) { const m = Store.state.finance.months[mk]; return m && m.categories ? Object.values(m.categories).reduce((a, b) => a + (+b || 0), 0) : 0; },
  goalPct(g) { return g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0; },
  mindAvg(wk) { const w = Store.state.weeks[wk]; if (!w || !w.ratings) return 0; const v = Object.values(w.ratings).filter(x => x > 0); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length) * 2 : 0; },
  /* Foco nos estudos */
  focusList(k) { const f = (Store.state.days[k] || {}).focus; return Array.isArray(f) ? f : []; },
  focusMin(k) { return Calc.focusList(k).reduce((a, x) => a + (x.min || 0), 0); },
  focusSum(dates) { return dates.reduce((a, d) => a + Calc.focusMin(D.key(d)), 0); },
  bookFocus(id) { let t = 0; Object.values(Store.state.days).forEach(d => (d.focus || []).forEach(x => { if (x.book === id) t += x.min || 0; })); return t; },
  focusStreak() { const g = Store.state.settings.focusGoal || 1; return Calc.streak(v => (v.focus || []).reduce((a, x) => a + (x.min || 0), 0) >= g); },

  /* Orçamento, gastos fixos e parcelas */
  monthsBetween(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); },
  instState(i, mk) {
    const idx = Calc.monthsBetween(i.start, mk);
    return { idx, active: idx >= 0 && idx < i.total, done: idx >= i.total, n: clamp(idx + 1, 1, i.total), left: Math.max(0, i.total - Math.max(0, idx)) };
  },
  committed(mk) {
    const F = Store.state.finance, byCat = {};
    let fixed = 0, inst = 0;
    F.fixed.forEach(f => { if (f.from && f.from > mk) return; const v = +f.amount || 0; fixed += v; byCat[f.category] = (byCat[f.category] || 0) + v; });
    F.installments.forEach(i => { if (Calc.instState(i, mk).active) { const v = +i.amount || 0; inst += v; byCat[i.category] = (byCat[i.category] || 0) + v; } });
    return { fixed, inst, total: fixed + inst, byCat };
  },
  /* O gasto de uma categoria é o maior entre o que você lançou e o que já está comprometido, para não contar duas vezes */
  budgetRows(mk) {
    const F = Store.state.finance, m = F.months[mk] || {}, cm = Calc.committed(mk);
    return F.categories.map(name => {
      const spent = +((m.categories || {})[name]) || 0, comm = cm.byCat[name] || 0, eff = Math.max(spent, comm), limit = +F.budgets[name] || 0;
      const pct = limit > 0 ? (eff / limit) * 100 : 0;
      return { name, spent, comm, eff, limit, pct, state: !limit ? 'none' : pct > 100 ? 'over' : pct >= 80 ? 'warn' : 'ok' };
    });
  },
  budgetAlerts() { return Calc.budgetRows(D.monthKey(D.today())).filter(r => r.state === 'warn' || r.state === 'over'); },

  /* Trabalho */
  toMin(t) { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); },
  isWorkday(d) { return (Store.state.settings.work.days || []).includes((d.getDay() + 6) % 7); },
  shiftMin() { const w = Store.state.settings.work; return Math.max(0, Calc.toMin(w.end) - Calc.toMin(w.start)); },
  workMin(k) {
    const v = (Calc.dayVal(k).work) || {}, w = Store.state.settings.work;
    if (v.status !== 'ok') return 0;
    return Math.max(0, Calc.toMin(v.out || w.end) - Calc.toMin(v.in || w.start));
  },
  shiftNow() {
    const w = Store.state.settings.work, now = new Date();
    const s = Calc.toMin(w.start), e = Calc.toMin(w.end), n = now.getHours() * 60 + now.getMinutes();
    const state = !Calc.isWorkday(D.today()) ? 'off' : n < s ? 'before' : n >= e ? 'after' : 'during';
    return { state, s, e, n, pct: e > s ? clamp(((n - s) / (e - s)) * 100, 0, 100) : 0 };
  },
  /* Tarefas de um dia: rotina fixa (que vale nesse dia da semana) + avulsas */
  /* work=false: tarefas pessoais (tela Tarefas); work=true: rotina do trabalho (módulo Trabalho) */
  tasksFor(k, work = false) {
    const S = Store.state, wd = (D.parse(k).getDay() + 6) % 7, day = S.days[k] || {}, done = day.done || {};
    const keep = t => (work ? t.pillar === 'trabalho' : t.pillar !== 'trabalho');
    const rec = S.tasks.filter(t => keep(t) && (t.days || []).includes(wd) && (!t.from || t.from <= k))
      .map(t => ({ id: t.id, name: t.name, pillar: t.pillar, rec: true, done: !!done[t.id] }));
    const one = (day.todos || []).filter(keep).map(t => ({ ...t, rec: false }));
    return [...rec, ...one];
  },
  taskStats(k) { const t = Calc.tasksFor(k); return { total: t.length, done: t.filter(x => x.done).length }; },
  taskStreak() {
    const full = k => { const s = Calc.taskStats(k); return s.total > 0 && s.done === s.total; };
    let d = D.today();
    if (!full(D.key(d))) d = D.add(d, -1);
    let n = 0;
    while (full(D.key(d)) && n < 3650) { n++; d = D.add(d, -1); }
    return n;
  },
  hasCheckin(w) { return !!w && (['feeling', 'good', 'insights', 'q1', 'q2', 'q3'].some(f => (w[f] || '').trim()) || Object.values(w.ratings || {}).some(x => x > 0)); },

  status() {
    const S = Store.state, s = S.settings, today = D.today(), mon = D.monday(today);
    const elapsed = D.daysBetween(mon, today) + 1;
    const tr = Calc.trains(mon), expected = Math.floor((s.trainGoal * elapsed) / 7);
    const wk = D.key(mon), mind = Calc.hasCheckin(S.weeks[wk]);
    const rs = Calc.readStreak();
    const mk = D.monthKey(today), pmk = D.addMonths(mk, -1);
    const fm = S.finance.months[mk] || {};
    const finOk = !!fm.invoice || !!(S.finance.months[pmk] || {}).invoice || Calc.income(mk) > 0 || Calc.expenses(mk) > 0;
    const overBudget = Calc.budgetRows(mk).some(r => r.state === 'over');
    const sm = MONTHS_SHORT[today.getMonth()].toLowerCase();
    const workdays = Calc.weekDays(mon).filter(Calc.isWorkday);
    const before = workdays.filter(d => d < today).map(D.key);
    const marked = k => ['ok', 'folga'].includes(((S.days[k] || {}).work || {}).status);
    const workOk = before.every(marked);
    const worked = workdays.filter(d => d <= today && (((S.days[D.key(d)] || {}).work || {}).status === 'ok')).length;
    return [
      { id: 'financeiro', ok: finOk && !overBudget, indicator: overBudget ? 'limite de categoria estourado' : fm.invoice ? `fatura de ${sm} enviada` : (finOk ? 'mês em lançamento' : `fatura de ${sm} pendente`), goal: 'fatura e gastos do mês', rule: 'mês com lançamentos ou fatura enviada e nenhuma categoria acima do limite' },
      { id: 'estudos', ok: rs > 0, indicator: `${rs} ${rs === 1 ? 'dia seguido' : 'dias seguidos'} lendo`, goal: `${s.pagesGoal} páginas por dia`, rule: 'meta de páginas cumprida ontem ou hoje' },
      { id: 'emocional', ok: mind, indicator: mind ? `nota da semana: ${fmt(Calc.mindAvg(wk))}/10` : 'check-in pendente', goal: 'check-in semanal', rule: 'check-in da semana feito' },
      { id: 'trabalho', ok: workOk && !S.demands.some(d => d.status === 'nova' && Date.now() - d.date > 864e5), indicator: `${worked}/${workdays.length} dias de expediente · ${S.demands.filter(d => d.status !== 'concluida').length} demandas abertas`, goal: `${s.work.start} às ${s.work.end}`, rule: 'ponto marcado até ontem e nenhuma demanda nova parada há mais de 1 dia' },
      { id: 'saude', ok: tr >= expected, indicator: `${tr}/${s.trainGoal} treinos essa semana`, goal: `${s.trainGoal} treinos por semana`, rule: 'treinos no ritmo da meta semanal' },
    ];
  },
};

const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 1) => Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
const brl = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

}
function pillarHeader(id, desc, right = '') { const p = pillar(id); return pageHeader({ eyebrow: `Pilar ${p.n} · ${p.name}`, title: p.title, desc, right }); }
function trend(cur, prev, { invert = false, suffix = 'vs semana passada' } = {}) {
  if (!prev) return `<div class="trend">sem dados para comparar</div>`;
  const pct = ((cur - prev) / prev) * 100, up = pct >= 0, good = invert ? !up : up;
  return `<div class="trend"><span class="${good ? 'up' : 'down'}">${icon(up ? 'up' : 'down')}${fmt(Math.abs(pct))}%</span>${esc(suffix)}</div>`;
}
function statCard({ label, value, unit = '', foot = '', dark = false }) {
  return `<div class="stat ${dark ? 'dark' : ''}"><div class="label">${esc(label)}</div><div><div class="value">${value}${unit ? `<small>${esc(unit)}</small>` : ''}</div>${foot ? `<div style="margin-top:6px">${foot}</div>` : ''}</div></div>`;
}
const footText = t => `<div class="trend">${esc(t)}</div>`;
function card({ title = '', sub = '', right = '', body = '', cls = '' }) {
  return `<section class="card ${cls}">${title || right ? `<div class="card-head"><div><div class="card-title">${esc(title)}</div>${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}</div>${right}</div>` : ''}${body}</section>`;
}
function niceStep(x) { if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const fmtTick = v => (v >= 1000 ? `${fmt(v / 1000)}K` : fmt(v));
function barChart({ items, goal = 0, height = 190, unit = '', action = '', fmtV = v => fmt(v) }) {
  const maxV = Math.max(goal, ...items.map(i => i.value), 0);
  const step = niceStep((maxV || 4) / 4), max = step * 4;
  const ticks = [0, 1, 2, 3, 4].map(i => `<span style="bottom:${i * 25}%">${fmtTick(step * i)}</span>`).join('');
  const bars = items.map(it => {
    const h = clamp((it.value / max) * 100, 0, 100);
    const attrs = action ? `data-action="${action}" data-date="${esc(it.key)}" role="button" tabindex="0" aria-label="${esc(it.label)}: ${esc(fmtV(it.value))}${esc(unit)}"` : '';
    return `<div class="bar-col ${action ? 'clickable' : ''} ${it.selected ? 'selected' : ''}" ${attrs}><div class="bar ${it.hl ? 'hl' : ''} ${it.value ? '' : 'zero'}" style="height:${it.value ? Math.max(h, 3) : 3}%" data-v="${esc(fmtV(it.value))}${esc(unit)}"></div></div>`;
  }).join('');
  const goalLine = goal ? `<div class="goal-line" style="bottom:${(goal / max) * 100}%"><span>meta ${fmt(goal)}${esc(unit)}</span></div>` : '';
  return `<div class="chart" style="--h:${height}px"><div class="chart-y">${ticks}</div><div class="chart-plot">${goalLine}${bars}</div><div class="chart-x">${items.map(i => `<span class="${i.hl ? 'hl' : ''}">${esc(i.label)}</span>`).join('')}</div></div>`;
}

const donut = pct => `<div class="donut" style="--p:${clamp(pct, 0, 100)}"><span>${Math.round(pct)}%</span></div>`;
function rating(value, attrs, cls = '') { return `<div class="rating ${cls}">${[1, 2, 3, 4, 5].map(v => `<button class="${v <= value ? 'on' : ''}" ${attrs} data-v="${v}" aria-label="Nota ${v}"></button>`).join('')}</div>`; }

function overviewSeries(metric, period) {
  const s = Store.state.settings, today = D.today();
  const val = dates => metric === 'treinos' ? Calc.trainsIn(dates) : metric === 'sono' ? Calc.sleepAvg(dates) : Calc.pages(dates);
  if (period === 'semanas') {
    const mon = D.monday(today);
    return {
      items: [5, 4, 3, 2, 1, 0].map(i => { const m = D.add(mon, -7 * i); return { label: i === 0 ? 'Esta' : `${m.getDate()}/${m.getMonth() + 1}`, value: Math.round(val(Calc.upToToday(Calc.weekDays(m))) * 10) / 10, hl: i === 0 }; }),
      goal: metric === 'treinos' ? s.trainGoal : metric === 'sono' ? s.sleepGoal : s.pagesGoal * 7,
    };
  }
  const cur = D.monthKey(today);
  return {
    items: [5, 4, 3, 2, 1, 0].map(i => { const mk = D.addMonths(cur, -i); return { label: MONTHS_SHORT[Number(mk.split('-')[1]) - 1], value: Math.round(val(Calc.upToToday(Calc.monthDates(mk))) * 10) / 10, hl: i === 0 }; }),
    goal: metric === 'sono' ? s.sleepGoal : 0,
  };
}

  const st = Calc.status(), ok = st.filter(x => x.ok).length, total = st.length;
  const elapsed = D.daysBetween(mon, today) + 1;
  const cur = Calc.range(mon, elapsed), prev = Calc.range(D.add(mon, -7), elapsed);
  const mk = D.monthKey(today), pmk = D.addMonths(mk, -1);
  const saldo = Calc.income(mk) - Calc.expenses(mk);

  const pills = (key, opts) => opts.map(([k, l]) => `<button class="pill ${ui[key] === k ? 'active' : ''}" data-action="setUi" data-key="${key}" data-value="${k}">${l}</button>`).join('');
  const series = overviewSeries(ui.ovMetric, ui.ovPeriod);
  const unit = ui.ovMetric === 'sono' ? 'h' : ui.ovMetric === 'leitura' ? ' pág' : '';
  const chartTitle = { treinos: 'Treinos concluídos', sono: 'Média de sono', leitura: 'Páginas lidas' }[ui.ovMetric];

  const calMon = D.add(mon, 7 * ui.calOffset), mid = D.add(calMon, 3);

const TIMER_KEY = 'painel-vida:timer';
const fmtClock = ms => {
  const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? `${h}:${String(m).padStart(2, '0')}` : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
};
const hmin = m => (m >= 60 ? `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, '0')}` : `${Math.round(m)} min`);
const clockHM = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

/* O cronômetro roda na página; o início fica guardado no navegador para sobreviver a um recarregamento */
const Focus = {
  t: null, tick: null,
  load() {
    try { const raw = localStorage.getItem(TIMER_KEY); this.t = raw ? JSON.parse(raw) : null; } catch (e) { this.t = null; }
    if (this.t && !(this.t.start > 0)) this.t = null;
  },
  save() { try { if (this.t) localStorage.setItem(TIMER_KEY, JSON.stringify(this.t)); else localStorage.removeItem(TIMER_KEY); } catch (e) { /* sem armazenamento */ } },
  target() { return this.t ? (this.t.target || 0) : 0; },
  elapsed() { return this.t ? Date.now() - this.t.start : 0; },
  init() {
    this.load();
    if (this.t) {
      if (this.target() && this.elapsed() >= this.target() * 60000) { this.finish(true); commit(); return; }
      this.run();
    }
    safeRender();
  },
  start() {
    if (this.t) return;
    this.t = { start: Date.now(), target: UI.state.focusTarget || 0, book: UI.state.focusBook || '' };
    this.save(); this.run();
  },
  run() { clearInterval(this.tick); this.tick = setInterval(() => this.update(), 1000); this.update(); },
  update() {
    if (!this.t) { clearInterval(this.tick); return; }
    const el = this.elapsed(), tg = this.target() * 60000;
    if (tg && el >= tg) { this.finish(true); commit(); return; }
    const txt = fmtClock(tg ? tg - el : el);
    ['focus-clock', 'focus-mini'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = txt; });
    const ring = document.getElementById('focus-ring');
    if (ring) ring.style.setProperty('--p', tg ? (el / tg) * 100 : (el % 60000) / 600);
    document.title = `${txt} · Foco · Painel da Vida`;
  },
  /* auto: o tempo da meta acabou; save=false descarta sem registrar. Quem chama atualiza a tela. */
  finish(auto, save = true) {
    const t = this.t; if (!t) return;
    clearInterval(this.tick); this.tick = null; this.t = null; this.save();
    const ms = auto && t.target ? t.target * 60000 : Date.now() - t.start;
    const min = Math.round(ms / 60000);
    if (!save) return;
    if (min < 1) { toast('Menos de 1 minuto: não registrei.'); return; }
    const d = Store.day(D.key(new Date(t.start)));
    d.focus = d.focus || [];
    d.focus.push({ id: uid(), min, book: t.book || '', at: t.start + ms });
    toast(auto ? `Foco concluído: +${min} min 🎉` : `Foco registrado: ${min} min`);
  },
};

Views.emocional = () => {
  const S = Store.state, ui = UI.state, thisMon = D.monday(D.today());
  const mon = D.add(thisMon, 7 * ui.mindOffset), wk = D.key(mon);
  const w = S.weeks[wk] || { ratings: {} }, ratings = w.ratings || {};
  const rated = PILLARS.filter(p => ratings[p.id] > 0);
  const best = rated.length ? rated.reduce((a, b) => (ratings[b.id] > ratings[a.id] ? b : a)) : null;
  const worst = rated.length ? rated.reduce((a, b) => (ratings[b.id] < ratings[a.id] ? b : a)) : null;
  const checkins = Object.values(S.weeks).filter(Calc.hasCheckin).length;
  const avg = Calc.mindAvg(wk), prevAvg = Calc.mindAvg(D.key(D.add(mon, -7)));
  const field = (f, ph, rows = 3) => `<textarea id="mind-${f}" class="input" rows="${rows}" data-input="mind" data-week="${wk}" data-field="${f}" data-k="mind-${f}" placeholder="${esc(ph)}">${esc(w[f] || '')}</textarea>`;
  const ratingRows = PILLARS.map(p => `<div class="row"><div class="grow" style="display:flex;align-items:center;gap:10px;font-weight:600">${icon(p.icon)} ${esc(p.name)}</div>${rating(ratings[p.id] || 0, `data-action="setRating" data-week="${wk}" data-p="${p.id}"`)}</div>`).join('');
  const hist = [5, 4, 3, 2, 1, 0].map(i => { const m = D.add(thisMon, -7 * i); return { label: i === 0 ? 'Esta' : `${m.getDate()}/${m.getMonth() + 1}`, value: Math.round(Calc.mindAvg(D.key(m)) * 10) / 10, hl: i === 0 }; });
  return `
  ${pillarHeader('emocional', 'Como você está, o que aprendeu e como foi a semana: terapia, leituras e reflexões num lugar só.',
    navGroup({ label: ui.mindOffset === 0 ? 'Esta semana' : rangeLabel(mon), prevAttrs: 'data-action="shift" data-key="mindOffset" data-delta="-1"', nextAttrs: 'data-action="shift" data-key="mindOffset" data-delta="1"', nextDisabled: ui.mindOffset >= 0 }))}
  <div class="stats">
    ${statCard({ label: 'Nota da semana', value: avg ? fmt(avg) : '—', unit: '/ 10', foot: trend(avg, prevAvg), dark: true })}
    ${statCard({ label: 'Pilar mais forte', value: best ? esc(best.name) : '—', foot: footText(best ? `nota ${ratings[best.id]} de 5` : 'dê notas abaixo') })}
    ${statCard({ label: 'Pilar para cuidar', value: worst ? esc(worst.name) : '—', foot: footText(worst ? `nota ${ratings[worst.id]} de 5` : 'dê notas abaixo') })}
    ${statCard({ label: 'Check-ins registrados', value: checkins, unit: checkins === 1 ? 'semana' : 'semanas' })}
  </div>
  <div class="grid g-2">
    ${card({ title: 'Check-in emocional', sub: `Semana de ${rangeLabel(mon)} · salva automaticamente`,
      body: `<div class="field" style="margin-bottom:14px"><label for="mind-feeling">Como você está?</label>${field('feeling', 'Escreva livremente como foi a semana...', 4)}</div>
        <div class="field"><label for="mind-good">Uma coisa boa</label><input id="mind-good" class="input" data-input="mind" data-week="${wk}" data-field="good" data-k="mind-good" value="${esc(w.good || '')}" placeholder="ex: um café da manhã tranquilo"></div>` })}
    ${card({ title: 'Nota para cada pilar', sub: 'De 1 a 5: como cada área foi nesta semana', body: ratingRows })}
  </div>
  <div class="grid g-2">
    ${card({ title: 'Insights & aprendizados', sub: 'Principais aprendizados da semana: terapia, leituras, o que vier', body: field('insights', 'O que ficou de aprendizado?', 6) })}
    ${card({ title: 'Perguntas da semana', sub: 'Três perguntas fixas para fechar a semana',
      body: `<div class="field" style="margin-bottom:12px"><label for="mind-q1">O que funcionou bem?</label>${field('q1', '', 2)}</div>
        <div class="field" style="margin-bottom:12px"><label for="mind-q2">O que quero fazer diferente?</label>${field('q2', '', 2)}</div>
        <div class="field"><label for="mind-q3">Qual vitória quero reconhecer?</label>${field('q3', '', 2)}</div>` })}
  </div>
  ${card({ title: 'Nota média por semana', sub: 'Últimas 6 semanas (escala de 0 a 10)', body: barChart({ items: hist, height: 150 }) })}`;
};

Views.saude = () => {
  const S = Store.state, s = S.settings, ui = UI.state, today = D.today(), tk = D.key(today), thisMon = D.monday(today);
  const mon = D.add(thisMon, 7 * ui.trainOffset), tr = Calc.trains(mon);
  const last6 = [5, 4, 3, 2, 1, 0].map(i => ({ label: i === 0 ? 'Esta' : `S-${i}`, value: Calc.trains(D.add(thisMon, -7 * i)), hl: i === 0 }));
  const strip = Calc.weekDays(mon).map((d, i) => { const k = D.key(d), done = !!Calc.dayVal(k).trained;
    return `<button class="day ${done ? 'done' : ''} ${k === tk ? 'today' : ''}" data-action="toggleTrain" data-date="${k}" ${d > today ? 'disabled' : ''} aria-pressed="${done}"><span class="dot"></span>${WEEKDAYS[i]}</button>`; }).join('');

  const past = Calc.upToToday(Calc.weekDays(thisMon));
  if (D.parse(ui.sleepDay) > today || D.parse(ui.sleepDay) < thisMon) ui.sleepDay = tk;
  const sel = ui.sleepDay, selDate = D.parse(sel), selVal = Calc.dayVal(sel);
  const sleepItems = Calc.weekDays(thisMon).map((d, i) => { const k = D.key(d); return { label: WEEKDAYS[i], value: Calc.dayVal(k).sleep || 0, key: k, hl: k === tk, selected: k === sel }; });
  const sleepAvg = Calc.sleepAvg(past), sleepPrev = Calc.sleepAvg(Calc.weekDays(D.add(thisMon, -7)));
  const selLabel = sel === tk ? 'Hoje' : `${WEEKDAYS[(selDate.getDay() + 6) % 7]}, ${selDate.getDate()}/${selDate.getMonth() + 1}`;

  const habitDays = Calc.range(D.add(today, -13), 14).map(d => { const k = D.key(d), on = !!Calc.dayVal(k).habit;
    return `<button class="${on ? 'on' : ''} ${k === tk ? 'today' : ''}" data-action="toggleHabit" data-date="${k}" title="${d.getDate()}/${d.getMonth() + 1}" aria-label="${d.getDate()}/${d.getMonth() + 1}${on ? ' feito' : ''}"></button>`; }).join('');
  const habitToday = !!Calc.dayVal(tk).habit, hs = Calc.habitStreak();
  const records = S.records.length ? S.records.map(r => `<div class="row"><div class="grow">${esc(r.text)}</div>${removeBtn(`data-list="records" data-id="${r.id}"`)}</div>`).join('') : '<div class="empty">Nenhum recorde ainda. Registre o primeiro acima.</div>';

  return `
  ${pillarHeader('saude', 'Treinos da semana, horas de sono, um hábito diário e seus recordes pessoais.')}
  <div class="stats">
    ${statCard({ label: 'Treinos essa semana', value: Calc.trains(thisMon), unit: `/ ${s.trainGoal}`, foot: footText(`semana passada: ${last6[4].value} · recorde: ${Calc.trainRecord()}`), dark: true })}
    ${statCard({ label: 'Média de sono', value: fmt(sleepAvg), unit: 'h por noite', foot: trend(sleepAvg, sleepPrev) })}
    ${statCard({ label: 'Energia ao acordar', value: fmt(Calc.energyAvg(past)), unit: '/ 5 em média' })}
    ${statCard({ label: s.habitName || 'Hábito diário', value: hs, unit: hs === 1 ? 'dia seguido' : 'dias seguidos', foot: footText(habitToday ? 'feito hoje' : 'ainda não marcado hoje') })}
  </div>
  <div class="grid g-2">
    ${card({ title: ui.trainOffset === 0 ? 'Treinos essa semana' : 'Treinos da semana', sub: `${rangeLabel(mon)} · toque para marcar`,
      right: `<div class="pills"><button class="icon-btn" data-action="shift" data-key="trainOffset" data-delta="-1" aria-label="Semana anterior">${icon('left')}</button><button class="icon-btn" data-action="shift" data-key="trainOffset" data-delta="1" ${ui.trainOffset >= 0 ? 'disabled' : ''} aria-label="Próxima semana">${icon('right')}</button></div>`,
      body: `<div class="days">${strip}</div><div class="card-foot"><div class="kv"><span>Meta da semana</span><b>${tr} / ${s.trainGoal}</b></div>${progress((tr / Math.max(1, s.trainGoal)) * 100, 'thick')}</div>` })}
    ${card({ title: 'Últimas 6 semanas', sub: 'Treinos concluídos por semana', body: barChart({ items: last6, goal: s.trainGoal, height: 170 }) })}
  </div>
  <div class="grid g-21">
    ${card({ title: 'Horas de sono', sub: 'Seg a dom · toque numa barra para editar o dia',
      body: `${barChart({ items: sleepItems, goal: s.sleepGoal, unit: 'h', action: 'selectSleepDay', height: 170 })}
        <div class="card-foot" style="display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center">
          <div><div class="field-label" style="margin-bottom:8px">${esc(selLabel)}</div>
            <div class="stepper"><button data-action="sleepStep" data-delta="-0.5" aria-label="Menos meia hora">–</button><span class="val">${fmt(selVal.sleep || 0)}h</span><button data-action="sleepStep" data-delta="0.5" aria-label="Mais meia hora">+</button></div></div>
          <div><div class="field-label" style="margin-bottom:10px">Energia ao acordar</div>${rating(selVal.energy || 0, `data-action="setEnergy" data-date="${sel}"`, 'lg')}</div>
        </div>` })}
    ${card({ title: s.habitName || 'Hábito diário', sub: 'Últimos 14 dias · toque para corrigir um dia',
      right: `<button class="btn ${habitToday ? '' : 'ghost'}" data-action="toggleHabit" data-date="${tk}">${habitToday ? `${icon('check')} Feito hoje` : 'Marcar hoje'}</button>`,
      body: `<div class="mini-days">${habitDays}</div><div class="card-foot"><div class="kv"><span>Sequência atual</span><b>${hs} ${hs === 1 ? 'dia' : 'dias'}</b></div></div><div class="tip">Troque o nome deste hábito em Configurações.</div>` })}
  </div>
  ${card({ title: 'Recordes pessoais', sub: 'Registre um PR para acompanhar sua evolução',
    body: `<form class="inline-form" data-submit="addRecord" style="margin-bottom:14px"><input class="input" name="text" placeholder="ex: agachamento 60kg, 5km em 28min..." maxlength="120" required aria-label="Novo recorde"><button class="btn" type="submit">Adicionar</button></form><div class="list-editor">${records}</div>` })}`;

const NEEDS_ALLOW = ['not_in_manifest', 'approval_required', 'consent_required'];

function parseDate(v) {
  if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
  const t = Date.parse(v || ''); return isNaN(t) ? 0 : t;
}
const senderOf = s => { const v = String(s || '').trim(); const m = v.match(/^"?([^"<]+?)"?\s*<([^>]+)>$/); return m ? m[1].trim() : v; };
function relTime(ms) {
  const diff = Date.now() - ms, min = Math.round(diff / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  if (h < 48) return 'ontem';
  const d = new Date(ms); return `${d.getDate()}/${d.getMonth() + 1}`;
}

const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const cleanSubject = s => String(s || '').replace(/^\s*((re|res|fw|fwd|enc)\s*:\s*)+/i, '').trim() || '(sem assunto)';
const isMine = m => (m.labelIds || []).includes('SENT');
function displayName(m) {
  const email = String(m.sender || '').toLowerCase();
  const hit = (m.addressDisplayNames || []).find(a => String(a.emailAddress || '').toLowerCase() === email);
  return (hit && hit.displayName) || senderOf(m.sender);
}

const Gmail = {
  mcp: null, state: 'off', code: '', lastSync: 0, unsub: [], started: false, inited: false, attachIds: new Set(),
  PAGE: 25,
  /* Só a caixa de entrada, só e-mails do domínio, só a partir do início do acompanhamento */
  query() {
    const w = Store.state.settings.work;
    return `in:inbox from:${w.gmailDomain || 'gerar.org.br'} after:${Math.floor((w.gmailSince || startOfToday()) / 1000)}`;
  },
  /* Versão anterior importava 30 dias: limpa demandas antigas e passa a contar só a partir de hoje */
  migrate() {
    const w = Store.state.settings.work;
    if (!w.gmailOn || w.gmailV === 2) return false;
    w.gmailSince = startOfToday(); w.gmailV = 2;
    Store.state.demands = Store.state.demands.filter(d => d.src !== 'gmail' || d.status === 'andamento' || d.date >= w.gmailSince);
    return true;
  },
  async init() {
    if (this.inited) return; this.inited = true;
    if (this.migrate()) { Sync.push(); safeRender(); }
    try { this.mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { this.mcp = null; }
    if (!this.mcp) { this.state = 'unavailable'; safeRender(); return; }
    if (Store.state.settings.work.gmailOn) this.start(); else safeRender();
  },
  start() {
    if (!this.mcp || this.started) return;
    this.started = true; this.state = 'connecting';
    const q = this.query(), opts = { refetchInterval: 300000 };
    try {
      this.unsub.push(this.mcp.watchTool('Gmail', 'search_threads', { query: q, pageSize: this.PAGE, view: 'THREAD_VIEW_SUMMARY' }, ev => this.onEvent(ev, 'main'), opts));
      this.unsub.push(this.mcp.watchTool('Gmail', 'search_threads', { query: q + ' has:attachment', pageSize: this.PAGE, view: 'THREAD_VIEW_IDS_ONLY' }, ev => this.onEvent(ev, 'attach'), opts));
    } catch (e) { this.fail(e); }
  },
  stop() { this.unsub.forEach(u => { try { u(); } catch (e) { /* já encerrado */ } }); this.unsub = []; this.started = false; },
  restart() { this.stop(); this.start(); },
  /* Chamado só por clique: a primeira leitura pede sua permissão para o Gmail */
  async connect() {
    if (!this.mcp) { toast('Abra o painel pelo link no Claude para conectar o Gmail.'); return; }
    const w = Store.state.settings.work;
    if (!w.gmailOn) { w.gmailSince = startOfToday(); w.gmailV = 2; }
    this.state = 'connecting'; render();
    try {
      const r = await this.mcp.callTool('Gmail', 'search_threads', { query: this.query(), pageSize: this.PAGE, view: 'THREAD_VIEW_SUMMARY' });
      w.gmailOn = true;
      this.state = 'ok'; this.code = ''; this.lastSync = Date.now();
      this.ingest(r.payload);
      this.restart();
      commit();
      toast('Gmail conectado. Demandas novas da caixa de entrada vão aparecer aqui.');
    } catch (e) { this.fail(e); render(); }
  },
  /* Recomeça a contagem a partir de hoje e tira da lista o que veio do Gmail antes disso */
  resetSince() {
    const w = Store.state.settings.work;
    w.gmailSince = startOfToday(); w.gmailV = 2;
    Store.state.demands = Store.state.demands.filter(d => d.src !== 'gmail' || d.status === 'andamento' || d.date >= w.gmailSince);
    if (w.gmailOn) this.restart();
  },
  onEvent(ev, kind) {
    if (Store.mode === 'loading') return;
    if (ev.type === 'error') { this.fail(ev.error); safeRender(); return; }
    const p = ev.result && ev.result.payload;
    if (kind === 'attach') {
      this.attachIds = new Set(((p && p.threads) || []).map(t => t.id));
      let ch = false;
      Store.state.demands.forEach(d => { if (d.src === 'gmail' && !d.attach && this.attachIds.has(d.thread)) { d.attach = true; ch = true; } });
      if (ch) { Sync.push(); safeRender(); }
      return;
    }
    this.state = 'ok'; this.code = '';
    this.lastSync = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
    this.ingest(p);
  },
  ingest(p) {
    const threads = p && Array.isArray(p.threads) ? p.threads : [];
    const S = Store.state, w = S.settings.work, since = w.gmailSince || startOfToday();
    const added = [], seenIds = new Set();
    let changed = false;
    threads.forEach(t => {
      const last = (t.messages || [])[(t.messages || []).length - 1] || {};
      const date = Number(last.internalDate) || parseDate(last.date) || Date.now();
      const mine = isMine(last);
      const ex = S.demands.find(d => d.src === 'gmail' && d.thread === t.id);
      seenIds.add(t.id);
      if (!ex) {
        if (mine) return; // você já respondeu: não é demanda pendente
        const d = { id: uid(), src: 'gmail', thread: t.id, from: displayName(last), subject: cleanSubject(last.subject), url: t.viewUrl || last.viewUrl || '', date, attach: this.attachIds.has(t.id), status: 'nova', seen: false };
        S.demands.push(d); added.push(d); changed = true;
      } else if (mine) {
        if (ex.status !== 'concluida') { ex.status = 'concluida'; ex.doneAt = date; ex.doneBy = 'reply'; ex.seen = true; ex.reply = false; changed = true; }
      } else if (date > (ex.date || 0)) {
        Object.assign(ex, { date, seen: false, reply: true, from: displayName(last) });
        if (ex.status === 'concluida') { ex.status = 'andamento'; delete ex.doneAt; delete ex.doneBy; }
        added.push(ex); changed = true;
      }
    });
    /* Saiu da caixa de entrada (arquivado ou apagado no Gmail): conclui a demanda */
    if (threads.length < this.PAGE) {
      S.demands.forEach(d => {
        if (d.src === 'gmail' && d.status === 'nova' && d.date >= since && !seenIds.has(d.thread) && !String(d.thread).startsWith('exemplo')) {
          d.status = 'concluida'; d.doneAt = Date.now(); d.doneBy = 'archive'; d.seen = true; changed = true;
        }
      });
    }
    if (changed) { Store.fresh = false; Sync.push(); }
    if (added.length) toast(added.length === 1 ? `Nova demanda: ${added[0].subject}` : `${added.length} novas demandas do trabalho`);
    safeRender();
  },
  fail(e) { this.code = (e && e.code) || 'upstream_error'; this.state = 'error'; },
};

function gmailLine() {
  const w = Store.state.settings.work, G = Gmail;
  let cls = 'local', text;
  if (G.state === 'unavailable') text = 'disponível só abrindo pelo link no Claude';
  else if (!w.gmailOn && G.state !== 'connecting') text = 'desligada';
  else if (G.state === 'connecting') { cls = 'saving'; text = 'conectando ao Gmail…'; }
  else if (G.state === 'error') { cls = 'err'; text = GMAIL_MSG[G.code] || 'O Gmail não respondeu agora. Tento de novo na próxima verificação.'; }
  else { cls = ''; const t = new Date(G.lastSync); text = `Gmail conectado · verificado às ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} · confere a cada 5 min`; }
  return `<span class="sync ${cls}"><i></i>${esc(text)}</span>`;
}

function demandRow(d) {
  const st = { nova: 'Nova', andamento: 'Em andamento', concluida: 'Concluída' }[d.status] || 'Nova';
  const next = d.status === 'nova' ? ['andamento', 'Começar'] : d.status === 'andamento' ? ['concluida', 'Concluir'] : ['andamento', 'Reabrir'];
  const link = d.src === 'gmail' && d.thread && !String(d.thread).startsWith('exemplo') ? (d.url || `https://mail.google.com/mail/#all/${encodeURIComponent(d.thread)}`) : '';
  return `<div class="dem ${d.seen && !UI.highlight.has(d.id) ? '' : 'unseen'} ${d.status === 'concluida' ? 'closed' : ''}">
    <span class="dem-src" title="${d.src === 'gmail' ? 'Veio do Gmail' : 'Adicionada à mão'}">${icon(d.src === 'gmail' ? 'mail' : 'user')}</span>
    <div class="grow">
      <div class="row-title">${esc(d.subject)}</div>
      <div class="row-sub">${esc(d.from || 'sem remetente')} · ${relTime(d.date)}${d.attach ? ` · ${icon('clip', 'mini')} anexo` : ''}${d.reply ? ' · <b>nova resposta</b>' : ''}${d.status === 'concluida' && d.doneBy === 'reply' ? ' · respondida por você' : d.status === 'concluida' && d.doneBy === 'archive' ? ' · arquivada no Gmail' : ''}</div>
    </div>
    <span class="badge ${d.status === 'nova' ? 'dark' : 'light'}">${st}</span>
    <div class="dem-actions">
      ${link ? `<a class="btn ghost sm" href="${esc(link)}" target="_blank" rel="noopener" data-action="demSeen" data-id="${d.id}">Abrir</a>` : ''}
      <button class="btn sm ${d.status === 'concluida' ? 'ghost' : ''}" data-action="demStatus" data-id="${d.id}" data-v="${next[0]}">${next[1]}</button>
      ${removeBtn(`data-list="demands" data-id="${d.id}"`, 'Remover demanda')}
    </div>
  </div>`;
}

function demandsCard() {
  const S = Store.state, ui = UI.state, w = S.settings.work, G = Gmail;
  const open = S.demands.filter(d => d.status !== 'concluida').sort((a, b) => (a.status === b.status ? b.date - a.date : a.status === 'nova' ? -1 : 1));
  const closed = S.demands.filter(d => d.status === 'concluida').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 30);
  const list = ui.demFilter === 'abertas' ? open : closed;
  const pills = [['abertas', `Abertas (${open.length})`], ['concluidas', `Concluídas (${closed.length})`]]
    .map(([k, l]) => `<button class="pill ${ui.demFilter === k ? 'active' : ''}" data-action="setUi" data-key="demFilter" data-value="${k}">${l}</button>`).join('');
  let connect = '';
  if (G.state !== 'unavailable' && (!w.gmailOn || (G.state === 'error' && NEEDS_ALLOW.includes(G.code)))) {
    connect = `<div class="connect">${icon('mail')}<div class="grow"><b>${w.gmailOn ? 'Permita a leitura do Gmail' : 'Receba demandas do Gmail automaticamente'}</b>
      <div class="row-sub">E-mails de @${esc(w.gmailDomain)} que chegarem na caixa de entrada a partir de hoje viram demanda. Se você responder ou arquivar no Gmail, ela é concluída sozinha. O painel só lê: não responde, não apaga e não marca nada.</div></div>
      <button class="btn" data-action="gmailConnect" ${G.state === 'connecting' ? 'disabled' : ''}>${G.state === 'connecting' ? 'Conectando…' : (w.gmailOn ? 'Permitir acesso' : 'Conectar Gmail')}</button></div>`;
  }
  return card({ title: 'Demandas do trabalho', sub: `Caixa de entrada: e-mails de @${w.gmailDomain} desde ${new Date(w.gmailSince || startOfToday()).toLocaleDateString('pt-BR')}, e pedidos que você anotar`,
    right: `<div class="pills on-card">${pills}</div>`,
    body: `<div style="margin:-6px 0 14px">${gmailLine()}</div>${connect}
      ${list.length ? list.map(demandRow).join('') : `<div class="empty">${ui.demFilter === 'abertas' ? 'Nenhuma demanda aberta. Quando chegar e-mail da Gerar na caixa de entrada, ele aparece aqui.' : 'Nenhuma demanda concluída ainda.'}</div>`}
      <form class="inline-form wrap-sm card-foot" data-submit="addDemand">
        <input class="input" name="subject" placeholder="Anotar demanda (ex: pedido feito pessoalmente)" required maxlength="140" aria-label="Nova demanda">
        <input class="input" name="from" placeholder="Quem pediu" maxlength="60" style="max-width:170px" aria-label="Quem pediu">
        <button class="btn" type="submit" aria-label="Adicionar demanda">${icon('plus')}</button>
      </form>` });
}

Views.trabalho = () => {
  const S = Store.state, s = S.settings, w = s.work, ui = UI.state, today = D.today(), tk = D.key(today);
  const thisMon = D.monday(today), mon = D.add(thisMon, 7 * ui.workOffset);
  if (D.parse(ui.workDay) > today) ui.workDay = tk;
  const sel = ui.workDay, selDate = D.parse(sel), selWork = Calc.dayVal(sel).work || {};
  const sh = Calc.shiftNow(), shiftMin = Calc.shiftMin();

  const week = Calc.weekDays(mon);
  const workdays = week.filter(Calc.isWorkday);
  const weekMin = week.reduce((a, d) => a + Calc.workMin(D.key(d)), 0);
  const expectedMin = workdays.length * shiftMin;
  const mk = D.monthKey(today);
  const monthDays = Calc.upToToday(Calc.monthDates(mk)).filter(d => ((Calc.dayVal(D.key(d)).work) || {}).status === 'ok').length;
  const goals = S.workGoals;
  const goalsAvg = goals.length ? Math.round(goals.reduce((a, g) => a + g.progress, 0) / goals.length) : 0;

  const todayWork = (Calc.dayVal(tk).work || {}).status;
  let heroValue, heroUnit = '', heroFoot;
  if (todayWork === 'folga') { heroValue = 'Folga'; heroFoot = 'marcado como folga hoje'; }
  else if (sh.state === 'off') { heroValue = 'Sem expediente'; heroFoot = 'hoje não é dia de trabalho'; }
  else if (sh.state === 'before') { heroValue = w.start; heroUnit = 'começa'; heroFoot = `faltam ${hm(sh.s - sh.n)} para entrar`; }
  else if (sh.state === 'during') { heroValue = hm(sh.e - sh.n); heroUnit = 'para acabar'; heroFoot = `expediente em andamento · sai às ${w.end}`; }
  else { heroValue = 'Encerrado'; heroFoot = todayWork === 'ok' ? `ponto marcado · ${hm(Calc.workMin(tk))}` : 'lembre de marcar o ponto de hoje'; }

  const strip = week.map((d, i) => {
    const k = D.key(d), st = ((Calc.dayVal(k).work) || {}).status, isW = Calc.isWorkday(d);
    const cls = st === 'ok' ? 'done' : st === 'falta' ? 'miss' : st === 'folga' ? 'rest' : '';
    const label = st === 'ok' ? 'trabalhou' : st === 'falta' ? 'falta' : st === 'folga' ? 'folga' : isW ? 'sem marcação' : 'não é dia de trabalho';
    return `<button class="day ${cls} ${isW ? '' : 'offday'} ${k === tk ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-action="selectWorkDay" data-date="${k}" ${d > today ? 'disabled' : ''} aria-label="${WEEKDAYS[i]} ${d.getDate()}: ${label}" title="${label}"><span class="dot"></span>${WEEKDAYS[i]}</button>`;
  }).join('');
  const selLabel = sel === tk ? 'Hoje' : `${WEEKDAYS[(selDate.getDay() + 6) % 7]}, ${selDate.getDate()}/${selDate.getMonth() + 1}`;
  const stBtn = (v, l) => `<button class="pill ${selWork.status === v ? 'active' : ''}" data-action="setWork" data-date="${sel}" data-v="${v}" aria-pressed="${selWork.status === v}">${l}</button>`;

  const wk = D.key(thisMon), wn = S.weeks[wk] || {};
  const note = (f, label, ph) => `<div class="field" style="margin-bottom:12px"><label for="work-${f}">${esc(label)}</label><textarea id="work-${f}" class="input" rows="2" data-input="mind" data-week="${wk}" data-field="${f}" data-k="work-${f}" placeholder="${esc(ph)}">${esc(wn[f] || '')}</textarea></div>`;

  const tl = Calc.tasksFor(tk, true);
  const goalRows = goals.length ? goals.map(g => `<div class="row routine-row">
      <div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><span class="row-title" style="font-weight:500">${esc(g.name)}</span><span class="pct">${g.progress}%</span></div><div style="margin-top:9px">${progress(g.progress)}</div></div>
      <button class="btn ghost sm" data-action="workStep" data-id="${g.id}" data-delta="-10" aria-label="Diminuir 10%">−10%</button>
      <button class="btn ghost sm" data-action="workStep" data-id="${g.id}" data-delta="10" aria-label="Aumentar 10%">+10%</button>
      ${removeBtn(`data-list="workGoals" data-id="${g.id}"`)}
    </div>`).join('') : '<div class="empty">Nenhum objetivo ainda. Ex: dominar o sistema da empresa, fazer um curso.</div>';

  return `
  ${pillarHeader('trabalho', `${w.role} na ${w.company} · ${w.start} às ${w.end}`,
    navGroup({ label: ui.workOffset === 0 ? 'Esta semana' : rangeLabel(mon), prevAttrs: 'data-action="shiftWork" data-delta="-1"', nextAttrs: 'data-action="shiftWork" data-delta="1"', nextDisabled: ui.workOffset >= 0 }))}
  <div class="stats">
    ${statCard({ label: 'Expediente de hoje', value: esc(heroValue), unit: heroUnit, foot: footText(heroFoot), dark: true })}
    ${statCard({ label: ui.workOffset === 0 ? 'Horas na semana' : 'Horas nessa semana', value: hm(weekMin), unit: `/ ${hm(expectedMin)}`, foot: footText(`${week.filter(d => ((Calc.dayVal(D.key(d)).work) || {}).status === 'ok').length} de ${workdays.length} dias trabalhados`) })}
    ${statCard({ label: 'Demandas abertas', value: S.demands.filter(d => d.status !== 'concluida').length, foot: footText(`${S.demands.filter(d => d.status === 'nova').length} novas · ${monthDays} ${monthDays === 1 ? 'dia trabalhado' : 'dias trabalhados'} no mês`) })}
    ${statCard({ label: 'Objetivos profissionais', value: `${goalsAvg}%`, foot: footText(`média de ${goals.length} ${goals.length === 1 ? 'objetivo' : 'objetivos'}`) })}
  </div>
  ${demandsCard()}
  <div class="grid g-2">
    ${card({ title: 'Ponto da semana', sub: `${rangeLabel(mon)} · toque num dia para marcar`,
      body: `<div class="days">${strip}</div>
        <div class="card-foot" style="display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end">
          <div><div class="field-label" style="margin-bottom:8px">${esc(selLabel)}</div><div class="pills on-card">${stBtn('ok', 'Trabalhei')}${stBtn('folga', 'Folga')}${stBtn('falta', 'Falta')}</div></div>
          ${selWork.status === 'ok' ? `<div class="fields" style="flex:1;min-width:220px;max-width:320px">
            <div class="field"><label for="w-in">Entrada</label><input id="w-in" class="input" type="time" value="${esc(selWork.in || w.start)}" data-change="workTime" data-date="${sel}" data-field="in" data-k="w-in"></div>
            <div class="field"><label for="w-out">Saída</label><input id="w-out" class="input" type="time" value="${esc(selWork.out || w.end)}" data-change="workTime" data-date="${sel}" data-field="out" data-k="w-out"></div>
          </div>` : ''}
        </div>` })}
    ${card({ title: 'Expediente de hoje', sub: sh.state === 'off' ? 'Hoje não é dia de trabalho' : `${w.start} às ${w.end} · ${hm(shiftMin)}`,
      body: `<div class="kv"><span>${w.start}</span><b>${sh.state === 'during' ? `${Math.round(sh.pct)}% do expediente` : sh.state === 'after' ? 'encerrado' : sh.state === 'before' ? 'ainda não começou' : 'folga'}</b><span>${w.end}</span></div>
        ${progress(sh.state === 'after' ? 100 : sh.state === 'during' ? sh.pct : 0, 'thick')}
        <div class="card-foot">
          <div class="kv" style="margin-bottom:6px"><span class="card-title" style="font-size:14px">Rotina do trabalho</span><span class="small muted">só aparece aqui</span></div>
          ${tl.length ? tl.map(t => taskRow(t, tk, true)).join('') : '<div class="empty">Nenhuma tarefa de rotina para hoje. Ex: conferir a agenda do setor.</div>'}
          <form class="inline-form wrap-sm" data-submit="addTask" style="margin-top:12px">
            <input type="hidden" name="pillar" value="trabalho"><input type="hidden" name="day" value="${tk}">
            <input class="input" name="name" placeholder="Nova tarefa da rotina" required maxlength="100" aria-label="Nova tarefa da rotina do trabalho">
            <select class="input" name="repeat" style="max-width:130px" aria-label="Repetição"><option value="once">Só hoje</option><option value="weekdays">Dias úteis</option></select>
            <button class="btn" type="submit" aria-label="Adicionar tarefa">${icon('plus')}</button>
          </form>
        </div>` })}
  </div>
  <div class="grid g-2">
    ${card({ title: 'Registro da semana', sub: 'Anote para lembrar em avaliações e conversas com a chefia · salva sozinho',
      body: `${note('work1', 'O que eu entreguei', 'ex: organizei as notas fiscais do mês')}${note('work2', 'O que eu aprendi', 'ex: emitir relatórios no sistema')}${note('work3', 'Onde preciso de ajuda', 'ex: dúvidas sobre o processo de compras')}` })}
    ${card({ title: 'Objetivos profissionais', sub: 'Toque em "+10%" conforme for avançando',
      body: `${goalRows}<form class="inline-form card-foot" data-submit="addWorkGoal"><input class="input" name="name" placeholder="Novo objetivo (ex: curso de Excel)" required maxlength="100" aria-label="Novo objetivo"><button class="btn" type="submit">Adicionar</button></form>` })}
  </div>`;
};

  const setting = (key, label, type = 'number', extra = '') => `<div class="field"><label for="set-${key}">${esc(label)}</label><input id="set-${key}" class="input" type="${type}" value="${esc(s[key])}" data-change="setting" data-key="${key}" data-type="${type}" data-k="set-${key}" ${extra}></div>`;
