<title>Painel da Vida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Painel pessoal para acompanhar quatro pilares da vida: financeiro, estudos, emocional e saúde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================
   Painel da Vida — estilo monocromático (cartões brancos,
   destaque preto, pílulas e barras escuras arredondadas)
   ========================================================== */

:root {
  /* Layout: barra lateral fixa + cartões em grade; destaque escuro no 1º cartão de cada linha */
  --bg: #e6e6e9; --app: #efeff1; --card: #ffffff;
  --ink: #151517; --ink-2: #55555c; --ink-3: #8e8e96;
  --line: #e7e7eb; --soft: #f3f3f5; --hover: #e8e8ec; --track: #e4e4e8;
  --gray: #86868d; --on-hl: #ffffff;
  --dark: #161618; --on-dark: #ffffff;
  --feat-a: #1b1b1e; --feat-b: #2e2e33; --feat-fg: #ffffff; --feat-muted: #c9c9ce;
  --bar-a: #2c2c30; --bar-b: #101012; --hl-a: #9a9aa1; --hl-b: #7f7f86;
  --goal: #b4b4bb; --up: #2f9e5f; --down: #d9534f; --feat-up: #5fd08f; --feat-down: #ff8a85;
  --danger-bg: #fbeaea; --danger-fg: #b23b37; --row-hover: #fafafb; --placeholder: #a3a3aa;
  --radius: 20px; --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .03);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --app: #131315; --card: #1c1c1f;
    --ink: #f1f1f3; --ink-2: #b6b6bd; --ink-3: #85858d;
    --line: #2a2a2f; --soft: #252529; --hover: #303035; --track: #2e2e33;
    --gray: #75757d; --on-hl: #ffffff;
    --dark: #f1f1f3; --on-dark: #141416;
    --feat-a: #2a2a2f; --feat-b: #3b3b42; --feat-fg: #ffffff; --feat-muted: #c4c4ca;
    --bar-a: #f2f2f4; --bar-b: #c9c9cf; --hl-a: #7a7a82; --hl-b: #5f5f66;
    --goal: #5a5a62; --up: #4cc483; --down: #ff7b75; --feat-up: #6fdc9d; --feat-down: #ff9590;
    --danger-bg: #3a1f1f; --danger-fg: #ff8f8a; --row-hover: #222226; --placeholder: #6e6e76;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --app: #131315; --card: #1c1c1f;
  --ink: #f1f1f3; --ink-2: #b6b6bd; --ink-3: #85858d;
  --line: #2a2a2f; --soft: #252529; --hover: #303035; --track: #2e2e33;
  --gray: #75757d; --on-hl: #ffffff;
  --dark: #f1f1f3; --on-dark: #141416;
  --feat-a: #2a2a2f; --feat-b: #3b3b42; --feat-fg: #ffffff; --feat-muted: #c4c4ca;
  --bar-a: #f2f2f4; --bar-b: #c9c9cf; --hl-a: #7a7a82; --hl-b: #5f5f66;
  --goal: #5a5a62; --up: #4cc483; --down: #ff7b75; --feat-up: #6fdc9d; --feat-down: #ff9590;
  --danger-bg: #3a1f1f; --danger-fg: #ff8f8a; --row-hover: #222226; --placeholder: #6e6e76;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}
button { font: inherit; color: inherit; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  background: var(--app);
  max-width: 1480px;
  margin: 0 auto;
}

.sidebar {
  background: var(--card);
  padding: 28px 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar a:focus-visible, button:focus-visible, .input:focus-visible { outline: 2px solid var(--gray); outline-offset: 2px; }
.brand { font-weight: 800; font-size: 22px; letter-spacing: -.04em; padding: 0 12px 24px; white-space: nowrap; }
.brand span { color: var(--gray); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14.5px;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--soft); color: var(--ink); }
.nav a.active { background: var(--soft); color: var(--ink); font-weight: 700; }
.nav .l-short { display: none; }

.side-card {
  margin-top: auto;
  background: linear-gradient(140deg, var(--feat-a), var(--feat-b) 55%, var(--feat-a));
  color: var(--feat-fg); border-radius: 18px; padding: 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.side-card p { margin: 0; font-size: 12.5px; color: var(--feat-muted); }
.side-card strong { font-size: 30px; letter-spacing: -.03em; line-height: 1.1; }
.side-card span { font-size: 12.5px; color: var(--feat-muted); margin-bottom: 10px; }
.nav-bottom { margin-top: 12px; }

.main { padding-block: 28px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* ---------- Header ---------- */
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.03em; margin: 4px 0 6px; line-height: 1.15; }
.desc { color: var(--ink-2); font-size: 14px; max-width: 620px; margin: 0; line-height: 1.5; }
.head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.banner {
  background: var(--dark); color: var(--on-dark); border-radius: 16px;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; margin-bottom: 20px; font-size: 13.5px; flex-wrap: wrap;
}
.banner .btn { background: var(--card); color: var(--ink); }

/* ---------- Pills / buttons ---------- */
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  border: 0; background: var(--card); border-radius: 999px;
  padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: background .15s, color .15s; white-space: nowrap;
}
.pill:hover { background: var(--hover); }
.pill.active { background: var(--gray); color: var(--on-hl); }
.pills.on-card .pill { background: var(--soft); }
.pills.on-card .pill.active { background: var(--gray); }

.date-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 999px; padding: 8px 14px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.nav-group { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 4px; }
.nav-group .label { padding: 0 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft);
  display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none;
  transition: background .15s;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn .ic { width: 16px; height: 16px; }
.icon-btn.plain { background: transparent; }
.icon-btn.plain:hover { background: var(--soft); }

.btn {
  border: 0; border-radius: var(--radius-sm); padding: 10px 16px;
  font-weight: 600; font-size: 13.5px; background: var(--dark); color: var(--on-dark);
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  transition: opacity .15s, background .15s;
}
.btn:hover { opacity: .88; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.ghost:hover { background: var(--hover); opacity: 1; }
.btn.light { background: rgba(255,255,255,.14); color: var(--feat-fg); justify-content: center; text-decoration: none; }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
.btn.danger { background: var(--danger-bg); color: var(--danger-fg); }

/* ---------- Stat cards ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.stat {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px;
  min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  box-shadow: var(--shadow);
}
.stat.dark {
  background:
    linear-gradient(120deg, rgba(255,255,255,.06) 0 30%, transparent 30% 60%, rgba(255,255,255,.04) 60%),
    linear-gradient(140deg, var(--feat-a), var(--feat-b) 55%, var(--feat-a));
  color: var(--feat-fg);
}
.stat .label { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.stat.dark .label { color: var(--feat-muted); }
.stat .value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.stat .value small { font-size: 13.5px; font-weight: 500; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.stat.dark .value small { color: var(--feat-muted); }
.trend { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stat.dark .trend { color: var(--feat-muted); }
.trend .up, .trend .down { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
.trend .up { color: var(--up); }
.trend .down { color: var(--down); }
.stat.dark .trend .up { color: var(--feat-up); }
.stat.dark .trend .down { color: var(--feat-down); }
.trend .ic { width: 14px; height: 14px; }

/* ---------- Grid / cards ---------- */
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); }
.card.flush { padding-left: 0; padding-right: 0; }
.card.flush .card-head { padding: 0 22px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.card-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.card-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.card-foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.mono { font-variant-numeric: tabular-nums; }
.tip { font-size: 12.5px; color: var(--ink-2); background: var(--soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 14px; line-height: 1.5; }
.empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 18px 0; }

/* ---------- Bar chart ---------- */
.chart { display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; row-gap: 10px; }
.chart-y { position: relative; height: var(--h); font-size: 11.5px; color: var(--ink-3); }
.chart-y span { position: absolute; right: 0; transform: translateY(50%); line-height: 1; }
.chart-plot {
  position: relative; height: var(--h);
  display: flex; align-items: flex-end; gap: clamp(6px, 3%, 26px);
}
.bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; min-width: 0; }
.bar-col.clickable { cursor: pointer; }
.bar {
  width: 100%; max-width: 58px; border-radius: 14px; position: relative;
  background:
    linear-gradient(125deg, rgba(255,255,255,.10) 0 22%, transparent 22% 48%, rgba(255,255,255,.06) 48% 62%, transparent 62%),
    linear-gradient(180deg, var(--bar-a), var(--bar-b));
  transition: height .35s ease;
}
.bar.hl { background: linear-gradient(180deg, var(--hl-a), var(--hl-b)); }
.bar.zero { background: var(--soft); }
.bar-col.selected .bar { outline: 2px solid var(--ink); outline-offset: 3px; }
.bar-col:hover .bar::after {
  content: attr(data-v); position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--card); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 7px; white-space: nowrap; z-index: 2;
}
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--goal); pointer-events: none; z-index: 1; }
.goal-line span { position: absolute; right: 0; top: -18px; font-size: 10.5px; color: var(--ink-3); background: var(--card); padding: 0 4px; border-radius: 4px; }
.chart-x { grid-column: 2; display: flex; gap: clamp(6px, 3%, 26px); }
.chart-x span { flex: 1; text-align: center; font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-x span.hl { color: var(--ink); font-weight: 700; }

/* ---------- Week strip ---------- */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day {
  border: 0; background: var(--soft); border-radius: 14px; padding: 11px 0 9px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 700; color: var(--ink-3); cursor: pointer;
  transition: background .15s, color .15s, transform .1s;
}
.day:active { transform: scale(.96); }
.day .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.day.done { background: var(--dark); color: var(--on-dark); }
.day.done .dot { background: var(--on-dark); border-color: var(--on-dark); }
.day.today { box-shadow: inset 0 0 0 2px var(--gray); }
.day:disabled { opacity: .4; cursor: default; }

.mini-days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; }
.mini-days button { aspect-ratio: 1; border: 0; border-radius: 6px; background: var(--soft); cursor: pointer; padding: 0; }
.mini-days button.on { background: var(--dark); }
.mini-days button.today { box-shadow: inset 0 0 0 2px var(--gray); }

/* ---------- Calendar (overview) ---------- */
.cal-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; font-weight: 600; font-size: 15px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-col {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 10px 0 12px; border-radius: 14px; font-size: 12.5px; color: var(--ink-3);
}
.cal-col b { font-size: 14px; color: var(--ink); font-weight: 600; }
.cal-col.active { background: linear-gradient(180deg, var(--hl-a), var(--hl-b)); color: var(--on-hl); }
.cal-col.active b { color: var(--on-hl); }
.cal-col.future { opacity: .45; }
.marks { display: flex; gap: 3px; }
.marks em { width: 5px; height: 5px; border-radius: 50%; background: var(--track); }
.marks em.on { background: var(--dark); }
.cal-col.active .marks em { background: rgba(255,255,255,.35); }
.cal-col.active .marks em.on { background: var(--on-hl); }
.legend { font-size: 11.5px; color: var(--ink-3); text-align: center; margin-top: 12px; }

/* ---------- Donut ---------- */
.donut-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.donut {
  --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--gray) calc(var(--p) * 1%), var(--track) 0);
  display: grid; place-items: center;
}
.donut::before { content: ''; grid-area: 1/1; width: 48px; height: 48px; border-radius: 50%; background: var(--card); }
.donut span { grid-area: 1/1; font-size: 13px; font-weight: 700; z-index: 1; }

/* ---------- Progress ---------- */
.progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--dark); border-radius: 99px; transition: width .35s ease; }
.progress.gray > span { background: var(--gray); }
.progress.thick { height: 12px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.kv b { color: var(--ink); font-weight: 600; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
.table th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 10px 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 13px 22px; border-bottom: 1px solid var(--line); }
.table tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--row-hover); }
.pillar-cell { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.pillar-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; }
.badge { display: inline-block; padding: 5px 14px; border-radius: 99px; background: var(--gray); color: var(--on-hl); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.dark { background: var(--dark); color: var(--on-dark); }
.badge.light { background: var(--soft); color: var(--ink-2); }

/* ---------- Rows / lists ---------- */
.row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:first-child { padding-top: 0; }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 14px; }
.row-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.row-meta { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-variant-numeric: tabular-nums; }
.row .pct { font-size: 12.5px; color: var(--ink-3); font-weight: 600; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

.toggle-btn {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px;
  padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.toggle-btn.on { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }

.cat-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 110px; align-items: center; gap: 14px; padding: 8px 0; }
.cat-bar { height: 14px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.cat-bar span { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }

/* ---------- Inputs ---------- */
.input {
  border: 1px solid transparent; background: var(--soft); border-radius: var(--radius-sm);
  padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); width: 100%;
  transition: background .15s, border-color .15s;
}
.input::placeholder { color: var(--placeholder); }
.input:focus { outline: none; border-color: var(--ink); background: var(--card); }
textarea.input { resize: vertical; min-height: 92px; line-height: 1.5; }
.input.sm { padding: 7px 10px; font-size: 13px; }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.title-input { font-size: 16px; font-weight: 600; background: transparent; padding: 4px 6px; margin-left: -6px; }
.sub-input { font-size: 12.5px; color: var(--ink-3); background: transparent; padding: 2px 6px; margin-left: -6px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.inline-form { display: flex; gap: 8px; align-items: center; }
.inline-form .input { flex: 1; min-width: 0; }
.form-grid { display: grid; grid-template-columns: 2fr 1.4fr 1fr auto; gap: 8px; align-items: center; }

.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--soft); font-size: 18px; font-weight: 600; cursor: pointer; line-height: 1; }
.stepper button:hover { background: var(--hover); }
.stepper .val { min-width: 54px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.stepper .input { width: 76px; text-align: center; font-size: 18px; font-weight: 700; }

.rating { display: flex; gap: 6px; }
.rating button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--track); cursor: pointer; padding: 0; transition: background .15s, transform .1s; }
.rating button:hover { transform: scale(1.12); }
.rating button.on { background: var(--dark); }
.rating.lg button { width: 30px; height: 30px; }

.dropzone {

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>

<div id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================
   Painel da Vida — 4 pilares: Financeiro, Estudos, Emocional, Saúde.
   Dados: banco do Artifact no Claude (privado para quem está logado),
   com cópia no navegador quando o banco não está disponível.
   ========================================================== */

/* ---------------- Datas ---------------- */
const D = {
  key(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; },
  todayKey() { return D.key(D.today()); },
  add(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; },
  monday(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); return r; },
  monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
  addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); return D.monthKey(new Date(y, m - 1 + n, 1)); },
  daysBetween(a, b) { return Math.round((b - a) / 864e5); },
};
const WEEKDAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WEEKDAYS_FULL = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MONTHS_SHORT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

const PILLARS = [
  { id: 'financeiro', n: '01', name: 'Financeiro', icon: 'wallet', title: 'Fatura, gastos e metas de longo prazo' },
  { id: 'estudos',    n: '02', name: 'Estudos',    icon: 'book',   title: 'Leitura e aprendizados' },
  { id: 'emocional',  n: '03', name: 'Emocional',  icon: 'smile',  title: 'Check-in e balanço da semana' },
  { id: 'saude',      n: '04', name: 'Saúde',      icon: 'heart',  title: 'Treino, sono e movimento' },
];
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- Estado ---------------- */
function defaultState() {
  return {
    sample: false,
    settings: { name: '', trainGoal: 5, sleepGoal: 8, pagesGoal: 15, habitName: 'Caminhada de 20 min' },
    days: {},   // 'AAAA-MM-DD' -> { trained, sleep, energy, pages, habit }
    weeks: {},  // segunda 'AAAA-MM-DD' -> { feeling, good, insights, q1, q2, q3, ratings }
    records: [],
    books: [],
    finance: { categories: ['Moradia', 'Alimentação', 'Transporte', 'Lazer', 'Assinaturas e cursos'], months: {}, goals: [] },
  };
}

function rng(seed) { let s = seed % 2147483647; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function sampleState() {
  const s = defaultState();
  s.sample = true;
  const r = rng(20261123), today = D.today();
  for (let i = 69; i >= 1; i--) {
    s.days[D.key(D.add(today, -i))] = {
      trained: r() < 0.66,
      sleep: Math.round((6 + r() * 2.6) * 2) / 2,
      energy: 2 + Math.floor(r() * 4),
      pages: i <= 3 ? 15 + Math.floor(r() * 10) : (r() < 0.8 ? 6 + Math.floor(r() * 20) : 0),
      habit: i < 23 || r() < 0.6,
    };
  }
  s.days[D.key(today)] = { trained: true, sleep: 7, energy: 3, pages: 12, habit: false };
  const mon = D.monday(today);
  const refl = [
    ['Semana leve, consegui manter os treinos.', 'Acordar sem pressa ajudou muito.', 'Dormir antes das 23h'],
    ['Semana puxada no trabalho, pouco descanso.', 'Bloquear a agenda funcionou.', 'Dizer não para reunião sem pauta'],
    ['Me senti mais organizado com o painel.', 'Ler antes de dormir em vez do celular.', 'Planejar o domingo'],
    ['Cansado, mas com sensação de progresso.', 'Treinar de manhã.', 'Menos café à tarde'],
    ['Boa semana no geral.', 'Revisar os gastos semanalmente.', 'Manter a leitura no fim de semana'],
  ];
  for (let w = 1; w <= 5; w++) {
    const [feeling, q1, q2] = refl[w - 1];
    s.weeks[D.key(D.add(mon, -7 * w))] = {
      feeling, good: '', insights: '', q1, q2, q3: '',
      ratings: { financeiro: 2 + Math.floor(r() * 3), estudos: 2 + Math.floor(r() * 4), emocional: 2 + Math.floor(r() * 4), saude: 2 + Math.floor(r() * 4) },
    };
  }
  s.weeks[D.key(mon)] = {
    feeling: 'Hoje foi mais corrido que o normal, mas consegui equilibrar bem treino e trabalho.',
    good: 'Um café da manhã tranquilo antes de sair de casa.',
    insights: 'Percebi que meço meu valor pela produtividade. Quero terminar o dia reconhecendo o que deu certo.',
    q1: '', q2: '', q3: '',
    ratings: { financeiro: 3, estudos: 4, emocional: 3, saude: 4 },
  };
  s.records = [{ id: uid(), text: 'Agachamento: 60kg' }, { id: uid(), text: '5km em 28min' }];
  s.books = [
    { id: uid(), title: 'Essencialismo', author: 'Greg McKeown', total: 272, read: 222 },
    { id: uid(), title: 'O Poder do Hábito', author: 'Charles Duhigg', total: 408, read: 102 },
  ];
  const cur = D.monthKey(today);
  for (let j = 3; j >= 0; j--) {
    const mk = D.addMonths(cur, -j);
    const v = base => Math.round((base * (0.85 + r() * 0.3)) / 10) * 10;
    s.finance.months[mk] = {
      income: 5200 + Math.round(r() * 12) * 50,
      categories: { 'Moradia': 1800, 'Alimentação': v(1250), 'Transporte': v(680), 'Lazer': j === 0 ? v(300) : v(540), 'Assinaturas e cursos': v(380) },
    };
    if (j > 0) s.finance.months[mk].invoice = { name: `fatura-${mk}.pdf (exemplo)`, at: Date.now() - j * 30 * 864e5 };
  }
  s.finance.goals = [
    { id: uid(), name: 'Reserva de emergência', target: 15000, current: 9300 },
    { id: uid(), name: 'Viagem (Portugal, 2027)', target: 12000, current: 4560 },
    { id: uid(), name: 'Investimentos do ano', target: 10000, current: 8000 },
  ];
  return s;
}

function normalize(raw) {
  const s = Object.assign(defaultState(), raw || {});
  s.settings = Object.assign(defaultState().settings, (raw && raw.settings) || {});
  s.finance = Object.assign(defaultState().finance, s.finance || {});
  ['days', 'weeks'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  ['records', 'books'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.finance.months || typeof s.finance.months !== 'object') s.finance.months = {};
  if (!Array.isArray(s.finance.goals)) s.finance.goals = [];
  if (!Array.isArray(s.finance.categories)) s.finance.categories = [];
  return s;
}

/* Estado <-> documentos do banco (um por mês de dias, um por mês de finanças, um por ano de semanas) */
const clone = o => JSON.parse(JSON.stringify(o));
function toDocs(s) {
  const docs = {
    config: { v: 2, sample: !!s.sample, settings: s.settings, records: s.records, books: s.books, categories: s.finance.categories, goals: s.finance.goals },
  };
  Object.entries(s.days).forEach(([k, v]) => { const id = 'd-' + k.slice(0, 7); (docs[id] = docs[id] || { days: {} }).days[k] = v; });
  Object.entries(s.weeks).forEach(([k, v]) => { const id = 'w-' + k.slice(0, 4); (docs[id] = docs[id] || { weeks: {} }).weeks[k] = v; });
  Object.entries(s.finance.months).forEach(([k, v]) => { docs['f-' + k] = v; });
  return docs;
}
function fromDocs(docs) {
  const c = docs.config || {};
  const s = normalize({ sample: c.sample, settings: c.settings, records: c.records, books: c.books, finance: { categories: c.categories, goals: c.goals, months: {} } });
  Object.entries(docs).forEach(([id, d]) => {
    if (id.startsWith('d-')) Object.assign(s.days, d.days || {});
    else if (id.startsWith('w-')) Object.assign(s.weeks, d.weeks || {});
    else if (id.startsWith('f-')) s.finance.months[id.slice(2)] = d;
  });
  return clone(s);
}
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

const LOCAL_KEY = 'painel-vida:v2';
const Store = {
  state: null,
  mode: 'loading',     // loading | cloud | local
  loadNote: '',
  day(k) { return this.state.days[k] || (this.state.days[k] = {}); },
  week(k) { return this.state.weeks[k] || (this.state.weeks[k] = { ratings: {} }); },
  month(mk) { return this.state.finance.months[mk] || (this.state.finance.months[mk] = { income: 0, categories: {} }); },
};

const Sync = {
  col: null, written: {}, busy: {}, dirty: new Set(), textTimer: null,
  saving() { return Object.values(this.busy).some(Boolean) || this.dirty.size > 0 || !!this.textTimer; },
  push() {
    if (Store.mode === 'local') { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Store.state)); } catch (e) { /* sem armazenamento */ } return; }
    if (!this.col) return;
    const docs = toDocs(Store.state);
    const ids = new Set([...Object.keys(docs), ...Object.keys(this.written)]);
    ids.forEach(id => {
      const cur = docs[id] ? stable(docs[id]) : undefined;
      if (cur !== this.written[id]) this.write(id, docs[id] ? clone(docs[id]) : null, cur);
    });
    updateSync();
  },
  async write(id, body, json) {
    if (this.busy[id]) { this.dirty.add(id); return; }
    this.busy[id] = true;
    try {
      if (body) await this.col.doc(id).set(body); else await this.col.doc(id).delete();
      if (json === undefined) delete this.written[id]; else this.written[id] = json;
    } catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'O espaço do banco acabou. Apague meses antigos para continuar salvando.' : 'Não foi possível salvar agora. Vou tentar de novo na próxima alteração.');
    } finally {
      this.busy[id] = false;
      if (this.dirty.delete(id)) this.push();
      updateSync();
    }
  },
  pushTextSoon() {
    clearTimeout(this.textTimer);
    this.textTimer = setTimeout(() => { this.textTimer = null; this.push(); }, 700);
    updateSync();
  },
};

async function boot() {
  let db = null, id = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const [dbNs, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = dbNs;
      id = user ? await user.id() : null;
    }
  } catch (e) { db = null; }

  if (!db || !id) {
    Store.mode = 'local';
    let raw = null;
    try { raw = localStorage.getItem(LOCAL_KEY); } catch (e) { raw = null; }
    try { Store.state = raw ? normalize(JSON.parse(raw)) : defaultState(); } catch (e) { Store.state = defaultState(); }
    Store.fresh = !raw;
    render();
    return;
  }

  Sync.col = db.collection('data/users/' + id);
  const timer = setTimeout(() => { if (Store.mode === 'loading') { Store.loadNote = 'O banco do Claude ainda não respondeu. Confira a conexão; o painel abre assim que os dados chegarem.'; render(); } }, 10000);
  Sync.col.onSnapshot(snap => {
    const docs = {}, json = {};
    snap.docs.forEach(d => { if (d.exists) { docs[d.id] = d.data(); json[d.id] = stable(docs[d.id]); } });
    if (Store.mode === 'loading') {
      if (snap.metadata.fromCache && snap.empty) return; // espera a resposta do banco
      clearTimeout(timer);
      Store.mode = 'cloud';
      Sync.written = json;
      Store.fresh = snap.empty;
      Store.state = snap.empty ? defaultState() : fromDocs(docs);
      render();
      return;
    }
    if (Sync.saving()) return;
    const same = Object.keys(json).length === Object.keys(Sync.written).length && Object.keys(json).every(k => json[k] === Sync.written[k]);
    if (same) return;
    Sync.written = json;
    Store.state = fromDocs(docs);
    Store.fresh = false;
    safeRender();
  }, err => {
    clearTimeout(timer);
    if (Store.mode === 'loading') {
      Store.mode = 'local';
      Store.state = defaultState();
      Store.fresh = true;
      toast('Não consegui abrir o banco do Claude. Usando o armazenamento deste navegador.');
      render();
    } else {
      toast('A sincronização parou. Recarregue a página para retomar.');
    }
  });
}

/* ---------------- Cálculos ---------------- */
const Calc = {
  dayVal(k) { return Store.state.days[k] || {}; },
  range(start, n) { return Array.from({ length: Math.max(0, n) }, (_, i) => D.add(start, i)); },
  weekDays(mon) { return Calc.range(mon, 7); },
  upToToday(dates) { const t = D.today(); return dates.filter(d => d <= t); },
  trainsIn(dates) { return dates.filter(d => Calc.dayVal(D.key(d)).trained).length; },
  trains(mon) { return Calc.trainsIn(Calc.weekDays(mon)); },
  avgOf(dates, f) { const v = dates.map(d => Calc.dayVal(D.key(d))[f]).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; },
  sleepAvg(dates) { return Calc.avgOf(dates, 'sleep'); },
  energyAvg(dates) { return Calc.avgOf(dates, 'energy'); },
  pages(dates) { return dates.reduce((a, d) => a + (Calc.dayVal(D.key(d)).pages || 0), 0); },
  streak(pred) {
    let d = D.today();
    if (!pred(Calc.dayVal(D.key(d)))) d = D.add(d, -1);
    let n = 0;
    while (pred(Calc.dayVal(D.key(d))) && n < 3650) { n++; d = D.add(d, -1); }
    return n;
  },
  readStreak() { const g = Store.state.settings.pagesGoal; return Calc.streak(v => g > 0 && (v.pages || 0) >= g); },
  habitStreak() { return Calc.streak(v => !!v.habit); },
  trainRecord() {
    const c = {};
    Object.entries(Store.state.days).forEach(([k, v]) => { if (v.trained) { const m = D.key(D.monday(D.parse(k))); c[m] = (c[m] || 0) + 1; } });
    return Math.max(0, ...Object.values(c));
  },
  monthDates(mk) { const [y, m] = mk.split('-').map(Number); return Calc.range(new Date(y, m - 1, 1), new Date(y, m, 0).getDate()); },
  income(mk) { return +((Store.state.finance.months[mk] || {}).income) || 0; },
  expenses(mk) { const m = Store.state.finance.months[mk]; return m && m.categories ? Object.values(m.categories).reduce((a, b) => a + (+b || 0), 0) : 0; },
  goalPct(g) { return g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0; },
  mindAvg(wk) { const w = Store.state.weeks[wk]; if (!w || !w.ratings) return 0; const v = Object.values(w.ratings).filter(x => x > 0); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length) * 2 : 0; },
  hasCheckin(w) { return !!w && (['feeling', 'good', 'insights', 'q1', 'q2', 'q3'].some(f => (w[f] || '').trim()) || Object.values(w.ratings || {}).some(x => x > 0)); },

  status() {
    const S = Store.state, s = S.settings, today = D.today(), mon = D.monday(today);
    const elapsed = D.daysBetween(mon, today) + 1;
    const tr = Calc.trains(mon), expected = Math.floor((s.trainGoal * elapsed) / 7);
    const wk = D.key(mon), mind = Calc.hasCheckin(S.weeks[wk]);
    const rs = Calc.readStreak();
    const mk = D.monthKey(today), pmk = D.addMonths(mk, -1);
    const fm = S.finance.months[mk] || {};
    const finOk = !!fm.invoice || !!(S.finance.months[pmk] || {}).invoice || Calc.income(mk) > 0 || Calc.expenses(mk) > 0;
    const sm = MONTHS_SHORT[today.getMonth()].toLowerCase();
    return [
      { id: 'financeiro', ok: finOk, indicator: fm.invoice ? `fatura de ${sm} enviada` : (finOk ? 'mês em lançamento' : `fatura de ${sm} pendente`), goal: 'fatura e gastos do mês', rule: 'mês com lançamentos ou fatura enviada' },
      { id: 'estudos', ok: rs > 0, indicator: `${rs} ${rs === 1 ? 'dia seguido' : 'dias seguidos'} lendo`, goal: `${s.pagesGoal} páginas por dia`, rule: 'meta de páginas cumprida ontem ou hoje' },
      { id: 'emocional', ok: mind, indicator: mind ? `nota da semana: ${fmt(Calc.mindAvg(wk))}/10` : 'check-in pendente', goal: 'check-in semanal', rule: 'check-in da semana feito' },
      { id: 'saude', ok: tr >= expected, indicator: `${tr}/${s.trainGoal} treinos essa semana`, goal: `${s.trainGoal} treinos por semana`, rule: 'treinos no ritmo da meta semanal' },
    ];
  },
};

const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 1) => Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
const brl = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pillar = id => PILLARS.find(p => p.id === id);

function rangeLabel(mon) {
  const end = D.add(mon, 6), m1 = MONTHS_SHORT[mon.getMonth()].toLowerCase(), m2 = MONTHS_SHORT[end.getMonth()].toLowerCase();
  return mon.getMonth() === end.getMonth() ? `${mon.getDate()} – ${end.getDate()} ${m2} ${end.getFullYear()}` : `${mon.getDate()} ${m1} – ${end.getDate()} ${m2} ${end.getFullYear()}`;
}
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${cap(MONTHS[m - 1])} ${y}`; };
const longDate = d => `${WEEKDAYS_FULL[(d.getDay() + 6) % 7]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;

function pageHeader({ eyebrow, title, desc = '', right = '' }) {
  return `<header class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${desc ? `<p class="desc">${esc(desc)}</p>` : ''}</div>${right ? `<div class="head-right">${right}</div>` : ''}</header>`;
}
function pillarHeader(id, desc, right = '') { const p = pillar(id); return pageHeader({ eyebrow: `Pilar ${p.n} · ${p.name}`, title: p.title, desc, right }); }
function trend(cur, prev, { invert = false, suffix = 'vs semana passada' } = {}) {
  if (!prev) return `<div class="trend">sem dados para comparar</div>`;
  const pct = ((cur - prev) / prev) * 100, up = pct >= 0, good = invert ? !up : up;
  return `<div class="trend"><span class="${good ? 'up' : 'down'}">${icon(up ? 'up' : 'down')}${fmt(Math.abs(pct))}%</span>${esc(suffix)}</div>`;
}
function statCard({ label, value, unit = '', foot = '', dark = false }) {
  return `<div class="stat ${dark ? 'dark' : ''}"><div class="label">${esc(label)}</div><div><div class="value">${value}${unit ? `<small>${esc(unit)}</small>` : ''}</div>${foot ? `<div style="margin-top:6px">${foot}</div>` : ''}</div></div>`;
}
const footText = t => `<div class="trend">${esc(t)}</div>`;
function card({ title = '', sub = '', right = '', body = '', cls = '' }) {
  return `<section class="card ${cls}">${title || right ? `<div class="card-head"><div><div class="card-title">${esc(title)}</div>${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}</div>${right}</div>` : ''}${body}</section>`;
}
function niceStep(x) { if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const fmtTick = v => (v >= 1000 ? `${fmt(v / 1000)}K` : fmt(v));
function barChart({ items, goal = 0, height = 190, unit = '', action = '', fmtV = v => fmt(v) }) {
  const maxV = Math.max(goal, ...items.map(i => i.value), 0);
  const step = niceStep((maxV || 4) / 4), max = step * 4;
  const ticks = [0, 1, 2, 3, 4].map(i => `<span style="bottom:${i * 25}%">${fmtTick(step * i)}</span>`).join('');
  const bars = items.map(it => {
    const h = clamp((it.value / max) * 100, 0, 100);
    const attrs = action ? `data-action="${action}" data-date="${esc(it.key)}" role="button" tabindex="0" aria-label="${esc(it.label)}: ${esc(fmtV(it.value))}${esc(unit)}"` : '';
    return `<div class="bar-col ${action ? 'clickable' : ''} ${it.selected ? 'selected' : ''}" ${attrs}><div class="bar ${it.hl ? 'hl' : ''} ${it.value ? '' : 'zero'}" style="height:${it.value ? Math.max(h, 3) : 3}%" data-v="${esc(fmtV(it.value))}${esc(unit)}"></div></div>`;
  }).join('');
  const goalLine = goal ? `<div class="goal-line" style="bottom:${(goal / max) * 100}%"><span>meta ${fmt(goal)}${esc(unit)}</span></div>` : '';
  return `<div class="chart" style="--h:${height}px"><div class="chart-y">${ticks}</div><div class="chart-plot">${goalLine}${bars}</div><div class="chart-x">${items.map(i => `<span class="${i.hl ? 'hl' : ''}">${esc(i.label)}</span>`).join('')}</div></div>`;
}
const progress = (pct, cls = '') => `<div class="progress ${cls}"><span style="width:${clamp(pct, 0, 100)}%"></span></div>`;
const donut = pct => `<div class="donut" style="--p:${clamp(pct, 0, 100)}"><span>${Math.round(pct)}%</span></div>`;
function rating(value, attrs, cls = '') { return `<div class="rating ${cls}">${[1, 2, 3, 4, 5].map(v => `<button class="${v <= value ? 'on' : ''}" ${attrs} data-v="${v}" aria-label="Nota ${v}"></button>`).join('')}</div>`; }
function navGroup({ label, prevAttrs, nextAttrs, nextDisabled = false }) {
  return `<div class="nav-group"><button class="icon-btn plain" ${prevAttrs} aria-label="Anterior">${icon('left')}</button><span class="label">${esc(label)}</span><button class="icon-btn plain" ${nextAttrs} ${nextDisabled ? 'disabled' : ''} aria-label="Próximo">${icon('right')}</button></div>`;
}
const removeBtn = (attrs, label = 'Remover') => `<button class="icon-btn plain" data-action="remove" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${icon('x')}</button>`;
function toast(msg) {
  const el = document.getElementById('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

const Views = {};

function overviewSeries(metric, period) {
  const s = Store.state.settings, today = D.today();
  const val = dates => metric === 'treinos' ? Calc.trainsIn(dates) : metric === 'sono' ? Calc.sleepAvg(dates) : Calc.pages(dates);
  if (period === 'semanas') {
    const mon = D.monday(today);
    return {
      items: [5, 4, 3, 2, 1, 0].map(i => { const m = D.add(mon, -7 * i); return { label: i === 0 ? 'Esta' : `${m.getDate()}/${m.getMonth() + 1}`, value: Math.round(val(Calc.upToToday(Calc.weekDays(m))) * 10) / 10, hl: i === 0 }; }),
      goal: metric === 'treinos' ? s.trainGoal : metric === 'sono' ? s.sleepGoal : s.pagesGoal * 7,
    };
  }
  const cur = D.monthKey(today);
  return {
    items: [5, 4, 3, 2, 1, 0].map(i => { const mk = D.addMonths(cur, -i); return { label: MONTHS_SHORT[Number(mk.split('-')[1]) - 1], value: Math.round(val(Calc.upToToday(Calc.monthDates(mk))) * 10) / 10, hl: i === 0 }; }),
    goal: metric === 'sono' ? s.sleepGoal : 0,
  };
}

Views.visao = () => {

  const unit = ui.ovMetric === 'sono' ? 'h' : ui.ovMetric === 'leitura' ? ' pág' : '';

      <td><div class="pillar-cell"><span class="pillar-ic">${icon(p.icon)}</span>${esc(p.name)}</div></td>
      <td>${esc(x.indicator)}</td><td class="muted col-meta">${esc(x.goal)}</td>

  return `
  ${pageHeader({ eyebrow: 'Visão geral', title: s.name ? `Olá, ${s.name}` : 'Painel da Vida', desc: 'Quatro pilares, um plano de ação e a evolução de cada um. Toque em um pilar para abrir os detalhes.', right: `<span class="date-pill">${icon('calendar')} ${esc(rangeLabel(mon))}</span>` })}

    ${statCard({ label: 'Saldo do mês', value: brl(saldo), foot: Calc.income(mk) ? footText(`${Math.round((saldo / Calc.income(mk)) * 100)}% da receita`) : footText('informe a receita no Financeiro') })}
    ${statCard({ label: 'Páginas lidas', value: Calc.pages(cur), unit: 'na semana', foot: trend(Calc.pages(cur), Calc.pages(prev)) })}
    ${statCard({ label: 'Treinos na semana', value: Calc.trainsIn(cur), unit: `/ ${s.trainGoal}`, foot: trend(Calc.trainsIn(cur), Calc.trainsIn(prev)) })}
  </div>
  <div class="grid g-21">
    ${card({ title: chartTitle, sub: ui.ovPeriod === 'semanas' ? 'Últimas 6 semanas' : 'Últimos 6 meses',
      right: `<div class="pills on-card">${pills('ovMetric', [['treinos', 'Treinos'], ['sono', 'Sono'], ['leitura', 'Leitura']])}<span style="width:6px"></span>${pills('ovPeriod', [['semanas', 'Semanas'], ['meses', 'Meses']])}</div>`,
      body: barChart({ items: series.items, goal: series.goal, unit }) })}

          <button class="icon-btn plain" data-action="shift" data-key="calOffset" data-delta="-1" aria-label="Semana anterior">${icon('left')}</button>

        </div><div class="cal">${cal}</div><div class="legend">pontos: treino · leitura na meta · sono na meta</div>` })}
      ${card({ body: `<div class="donut-row"><div><div class="card-title">Pilares em dia</div><div class="trend" style="margin-top:6px">${ok} de ${total} nesta semana</div></div>${donut((ok / total) * 100)}</div>` })}

Views.financeiro = () => {

Views.estudos = () => {

  const last14 = Calc.range(D.add(today, -13), 14), pages14 = Calc.pages(last14), rhythm = pages14 / 14;
  const strip = Calc.range(D.add(today, -6), 7).map((d, i) => { const k = D.key(d), done = (Calc.dayVal(k).pages || 0) >= s.pagesGoal;

/* ---------------- Render ---------------- */
const ROUTES = ['visao', ...PILLARS.map(p => p.id), 'config'];
const route = () => { const r = location.hash.replace('#', ''); return ROUTES.includes(r) ? r : 'visao'; };
const $main = document.getElementById('main'), $side = document.getElementById('sidebar'), $modal = document.getElementById('modal');

function syncBadge() {
  if (Store.mode === 'local') return `<span class="sync local" id="sync"><i></i>neste navegador</span>`;
  const saving = Sync.saving();
  return `<span class="sync ${saving ? 'saving' : ''}" id="sync"><i></i>${saving ? 'salvando…' : 'salvo no Claude'}</span>`;
}
function updateSync() { const el = document.getElementById('sync'); if (el) el.outerHTML = syncBadge(); }

function sidebarHtml(r) {
  const link = (id, label, ic) => `<a href="#${id}" class="${r === id ? 'active' : ''}" ${r === id ? 'aria-current="page"' : ''}>${icon(ic)}<span class="l-full">${esc(label)}</span><span class="l-short">${esc(label === 'Visão geral' ? 'Geral' : label === 'Configurações' ? 'Ajustes' : label)}</span></a>`;
  const ready = Store.mode !== 'loading';
  const st = ready ? Calc.status() : [];
  return `<div class="brand">Painel<span>.</span>vida</div>
    <nav class="nav" aria-label="Pilares">${link('visao', 'Visão geral', 'grid')}${PILLARS.map(p => link(p.id, p.name, p.icon)).join('')}</nav>
    ${ready ? `<div class="side-card"><p>Consistência da semana</p><strong>${st.filter(x => x.ok).length}/${st.length}</strong><span>pilares em dia</span><a class="btn light" href="#emocional">Fazer check-in</a></div>` : '<div style="margin-top:auto"></div>'}
    <nav class="nav nav-bottom" aria-label="Configurações">${link('config', 'Configurações', 'sliders')}</nav>`;
}

function render() {
  const r = route();
  const active = document.activeElement, focusKey = active && active.dataset ? active.dataset.k : null;
  $side.innerHTML = sidebarHtml(r);
  if (Store.mode === 'loading') {
    $main.innerHTML = `<div class="loading"><div class="card"><div class="card-title">Abrindo seu painel…</div><p class="desc" style="margin-top:8px">${esc(Store.loadNote || 'Buscando seus dados salvos no Claude.')}</p></div></div>`;
    return;
  }
  let top = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">${syncBadge()}</div>`;
  if (Store.state.sample) top += `<div class="banner"><span>Você está vendo <b>dados de exemplo</b>. Quando quiser, comece com os seus.</span><button class="btn sm" data-action="clearSample">Começar do zero</button></div>`;
  else if (Store.fresh && r === 'visao') top += `<section class="card welcome"><div><div class="card-title">Bem-vindo ao seu Painel da Vida</div><p>Comece marcando um treino em Saúde, as páginas de hoje em Estudos ou a receita do mês em Financeiro. Se preferir conhecer o painel antes, carregue dados de exemplo.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-nav="config">Definir minhas metas</button><button class="btn ghost" data-action="loadSample">Ver exemplo</button></div></section>`;
  $main.innerHTML = top + Views[r]();
  if (focusKey) { const el = $main.querySelector(`[data-k="${CSS.escape(focusKey)}"]`); if (el) el.focus({ preventScroll: true }); }
  const p = pillar(r);
  document.title = p ? `${p.name} · Painel da Vida` : 'Painel da Vida';
}
function safeRender() {
  const a = document.activeElement;
  if (a && a.matches && a.matches('textarea, input[type="text"], input:not([type])') && $main.contains(a)) { UI.renderOnBlur = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (UI.renderOnBlur) { UI.renderOnBlur = false; setTimeout(render, 0); } });

function commit() { Store.fresh = false; Sync.push(); render(); }

/* Confirmação dentro da página (o visualizador do Claude não mostra confirm()) */
function ask(msg, yes, fn, danger = false) {
  UI.modal = fn;
  $modal.innerHTML = `<div class="modal-back" data-modal="no"><div class="modal" role="dialog" aria-modal="true" aria-label="Confirmação"><p>${esc(msg)}</p><div class="actions"><button class="btn ghost" data-modal="no">Cancelar</button><button class="btn ${danger ? 'danger' : ''}" data-modal="yes">${esc(yes)}</button></div></div></div>`;
  $modal.hidden = false;
  const b = $modal.querySelector('[data-modal="yes"]'); if (b) b.focus();
}
function closeModal() { UI.modal = null; $modal.hidden = true; $modal.innerHTML = ''; }

/* ---------------- Ações ---------------- */
const Actions = {
  setUi({ key, value }) { UI.state[key] = value; },
  shift({ key, delta }) { UI.state[key] = Math.min(0, UI.state[key] + Number(delta)); },
  shiftMonth({ delta }) { const n = D.addMonths(UI.state.finMonth, Number(delta)); if (n <= D.monthKey(D.today())) UI.state.finMonth = n; },
  toggleTrain({ date }) { const d = Store.day(date); d.trained = !d.trained; },
  toggleHabit({ date }) { const d = Store.day(date); d.habit = !d.habit; },
  selectSleepDay({ date }) { if (D.parse(date) > D.today()) return false; UI.state.sleepDay = date; },
  sleepStep({ delta }) { const d = Store.day(UI.state.sleepDay); d.sleep = clamp((d.sleep || 0) + Number(delta), 0, 14); },
  setEnergy({ date, v }) { const d = Store.day(date); d.energy = d.energy === +v ? 0 : +v; },
  setRating({ week, p, v }) { const w = Store.week(week); w.ratings = w.ratings || {}; w.ratings[p] = w.ratings[p] === +v ? 0 : +v; },
  togglePages({ date }) { const d = Store.day(date), g = Store.state.settings.pagesGoal; d.pages = (d.pages || 0) >= g ? 0 : g; },
  pagesStep({ delta }) { const d = Store.day(D.todayKey()); d.pages = Math.max(0, (d.pages || 0) + Number(delta)); },
  bookAdd({ id, n }) {
    const b = Store.state.books.find(x => x.id === id); if (!b) return false;
    const add = Math.min(Number(n), b.total - b.read); b.read += add;
    const d = Store.day(D.todayKey()); d.pages = (d.pages || 0) + add;
    if (b.read >= b.total) toast(`Livro concluído: ${b.title} 🎉`);
  },
  removeInvoice({ month }) {
    ask('Remover a fatura deste mês?', 'Remover', () => { delete Store.month(month).invoice; commit(); }, true);
    return false;
  },
  remove({ list, id }) {
    const S = Store.state;
    const doIt = () => {
      if (list === 'categories') S.finance.categories = S.finance.categories.filter(c => c !== id);
      else { const arr = { records: S.records, books: S.books, goals: S.finance.goals }[list]; const i = arr ? arr.findIndex(x => x.id === id) : -1; if (i >= 0) arr.splice(i, 1); }
      commit();
    };
    const msg = { books: 'Remover este livro?', goals: 'Remover esta meta e os aportes registrados?' }[list];
    if (msg) ask(msg, 'Remover', doIt, true); else doIt();
    return false;
  },
  loadSample() {
    ask('Substituir os dados atuais pelos dados de exemplo?', 'Carregar exemplo', () => { Store.state = sampleState(); commit(); toast('Dados de exemplo carregados'); });
    return false;
  },
  clearAll() {
    ask('Apagar todos os dados do painel? Isso não pode ser desfeito.', 'Apagar tudo', () => { Store.state = defaultState(); commit(); toast('Painel zerado'); }, true);
    return false;
  },
  clearSample() {
    ask('Apagar os dados de exemplo e começar com um painel vazio?', 'Começar do zero', () => { Store.state = defaultState(); Store.fresh = true; Sync.push(); location.hash = 'config'; render(); toast('Painel pronto. Comece pelas suas metas.'); });
    return false;
  },
};

const Forms = {
  addRecord({ text }) { Store.state.records.unshift({ id: uid(), text: text.trim() }); },
  addCategory({ name }) {
    const n = name.trim(), cats = Store.state.finance.categories;
    if (cats.some(c => c.toLowerCase() === n.toLowerCase())) { toast('Essa categoria já existe'); return false; }
    cats.push(n);
  },
  addBook({ title, author, total }) { Store.state.books.push({ id: uid(), title: title.trim(), author: (author || '').trim(), total: Math.max(1, Math.round(+total || 0)), read: 0 }); },
  addGoal({ name, target }) { Store.state.finance.goals.push({ id: uid(), name: name.trim(), target: Math.max(1, +target || 0), current: 0 }); },
  contribute({ amount }, { id }) {
    const g = Store.state.finance.goals.find(x => x.id === id), v = +amount || 0;
    if (!g || !v) return false;
    g.current = Math.max(0, g.current + v);
    toast(v > 0 ? `Aporte de ${brl(v)} registrado` : `Retirada de ${brl(-v)} registrada`);
  },
};

const Changes = {
  setting(v, { key, type }) {
    const s = Store.state.settings;
    if (type === 'number') { const n = +v; if (!(n > 0)) return false; s[key] = key === 'sleepGoal' ? Math.round(n * 2) / 2 : Math.round(n); }
    else s[key] = v.trim();
  },
  pagesToday(v) { Store.day(D.todayKey()).pages = Math.max(0, Math.round(+v || 0)); },
  income(v, { month }) { Store.month(month).income = Math.max(0, +v || 0); },
  category(v, { month, name }) { const m = Store.month(month); m.categories = m.categories || {}; m.categories[name] = Math.max(0, +v || 0); },
  invoice(_, { month }, el) {
    const file = el.files && el.files[0]; if (!file) return false;
    (async () => {
      let asset = null;
      if (UI.assets) {
        UI.uploading = true; render();
        try { asset = (await UI.assets.upload(file)).id; }
        catch (e) { toast('Não foi possível enviar o arquivo. Registrei só o nome da fatura.'); }
        UI.uploading = false;
      }
      const inv = { name: file.name, at: Date.now() };
      if (asset) inv.asset = asset;
      Store.month(month).invoice = inv;
      commit();
      toast('Fatura registrada');
    })();
    return false;
  },
};
const Inputs = { mind(v, { week, field }) { Store.week(week)[field] = v; Store.fresh = false; } };

document.addEventListener('click', e => {
  const m = e.target.closest('[data-modal]');
  if (m) {
    if (m.dataset.modal === 'no' && e.target !== m) return; // clique dentro do cartão não fecha
    const fn = m.dataset.modal === 'yes' ? UI.modal : null;
    closeModal(); if (fn) fn();
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); location.hash = nav.dataset.nav; return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || Store.mode === 'loading') return;
  const fn = Actions[el.dataset.action]; if (!fn) return;
  e.preventDefault();
  if (fn(el.dataset, el) === false) { render(); return; }
  commit();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-submit]'); if (!form) return;
  e.preventDefault();
  const fn = Forms[form.dataset.submit]; if (!fn) return;
  if (fn(Object.fromEntries(new FormData(form)), form.dataset) === false) return;
  commit();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const fn = Changes[el.dataset.change]; if (!fn) return;
  if (fn(el.value, el.dataset, el) === false) { render(); return; }
  commit();
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  const fn = Inputs[el.dataset.input];
  if (fn) { fn(el.value, el.dataset, el); Sync.pushTextSoon(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

render();
boot();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('assets').then(a => { UI.assets = a; UI.canUpload = !!a; if (Store.mode !== 'loading') safeRender(); }).catch(() => {});
}

</script>
